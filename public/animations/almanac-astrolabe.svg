<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" fill="none">
  <defs>
    <!-- Master Gradients -->
    <radialGradient id="almanacAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.12" />
      <stop offset="75%" stop-color="#141210" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0c0a09" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="goldBrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <linearGradient id="chaldeanPlanets" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d8b4fe" />
    </linearGradient>

    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0e7ff" />
      <stop offset="80%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <filter id="almanacGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes spinCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinCCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes moonPhasePulse {
        0%, 100% { transform: scale(0.96); opacity: 0.8; }
        50% { transform: scale(1.04); opacity: 1; filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.6)); }
      }
      @keyframes rayShine {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.8; }
      }

      .spin-dial-outer {
        animation: spinCW 60s linear infinite;
        transform-origin: 160px 160px;
      }
      .spin-planets {
        animation: spinCCW 42s linear infinite;
        transform-origin: 160px 160px;
      }
      .spin-zodiac-ring {
        animation: spinCW 30s linear infinite;
        transform-origin: 160px 160px;
      }
      .pulse-center-moon {
        animation: moonPhasePulse 4s ease-in-out infinite;
        transform-origin: 160px 160px;
      }
      .shimmer-rays {
        animation: rayShine 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Ambient Golden Astral Aura -->
  <circle cx="160" cy="160" r="145" fill="url(#almanacAura)" />

  <!-- Outer Machined Double Bezel -->
  <circle cx="160" cy="160" r="150" stroke="url(#goldBrass)" stroke-width="1.5" opacity="0.75" />
  <circle cx="160" cy="160" r="144" stroke="#292524" stroke-width="1" />
  <circle cx="160" cy="160" r="140" stroke="url(#goldBrass)" stroke-width="0.75" opacity="0.4" stroke-dasharray="3 3" />

  <!-- Fixed Cardinal & Horizon Guides -->
  <g stroke="url(#goldBrass)" stroke-width="0.75" opacity="0.4" class="shimmer-rays">
    <!-- Meridian / Zenith -->
    <line x1="160" y1="10" x2="160" y2="310" stroke-dasharray="4 4" />
    <!-- Horizon / Ascendant -->
    <line x1="10" y1="160" x2="310" y2="160" stroke-dasharray="4 4" />
    <line x1="54" y1="54" x2="266" y2="266" opacity="0.25" />
    <line x1="54" y1="266" x2="266" y2="54" opacity="0.25" />
  </g>

  <!-- Rotating Ring 1: 24 Planetary Hour Degree Dial (Clockwise) -->
  <g class="spin-dial-outer">
    <g transform="translate(160, 160)">
      <circle r="126" stroke="url(#goldBrass)" stroke-width="1.2" opacity="0.65" />
      <circle r="118" stroke="#292524" stroke-width="0.75" />
      
      <!-- 24 Hour Degree Hash Marks -->
      <g stroke="url(#goldBrass)" stroke-width="1" opacity="0.6">
        <!-- 24 ticks around 360 deg (every 15 deg) -->
        <line x1="0" y1="-126" x2="0" y2="-118" />
        <line x1="32.6" y1="-121.7" x2="30.5" y2="-114" />
        <line x1="63" y1="-109.1" x2="59" y2="-102.2" />
        <line x1="89.1" y1="-89.1" x2="83.4" y2="-83.4" />
        <line x1="109.1" y1="-63" x2="102.2" y2="-59" />
        <line x1="121.7" y1="-32.6" x2="114" y2="-30.5" />
        <line x1="126" y1="0" x2="118" y2="0" />
        <line x1="121.7" y1="32.6" x2="114" y2="30.5" />
        <line x1="109.1" y1="63" x2="102.2" y2="59" />
        <line x1="89.1" y1="89.1" x2="83.4" y2="83.4" />
        <line x1="63" y1="109.1" x2="59" y2="102.2" />
        <line x1="32.6" y1="121.7" x2="30.5" y2="114" />
        <line x1="0" y1="126" x2="0" y2="118" />
        <line x1="-32.6" y1="121.7" x2="-30.5" y2="114" />
        <line x1="-63" y1="109.1" x2="-59" y2="102.2" />
        <line x1="-89.1" y1="89.1" x2="-83.4" y2="83.4" />
        <line x1="-109.1" y1="63" x2="-102.2" y2="59" />
        <line x1="-121.7" y1="32.6" x2="-114" y2="30.5" />
        <line x1="-126" y1="0" x2="-118" y2="0" />
        <line x1="-121.7" y1="-32.6" x2="-114" y2="-30.5" />
        <line x1="-109.1" y1="-63" x2="-102.2" y2="-59" />
        <line x1="-89.1" y1="-89.1" x2="-83.4" y2="-83.4" />
        <line x1="-63" y1="-109.1" x2="-59" y2="-102.2" />
        <line x1="-32.6" y1="-121.7" x2="-30.5" y2="-114" />
      </g>
    </g>
  </g>

  <!-- Rotating Ring 2: 7 Chaldean Planetary Seals (Counter-Clockwise) -->
  <g class="spin-planets" filter="url(#almanacGlow)">
    <g transform="translate(160, 160)">
      <circle r="96" stroke="url(#chaldeanPlanets)" stroke-width="1.2" opacity="0.7" stroke-dasharray="6 4" />
      
      <!-- 7 Planetary Nodes: Saturn, Jupiter, Mars, Sun, Venus, Mercury, Moon (approx 51.4 deg apart) -->
      <!-- 1. Saturn ♄ (0 deg: 0, -96) -->
      <circle cx="0" cy="-96" r="7" fill="#141210" stroke="#fbbf24" stroke-width="1.2" />
      <text x="0" y="-93" font-size="9" font-family="serif" fill="#fbbf24" text-anchor="middle">♄</text>

      <!-- 2. Jupiter ♃ (51.4 deg: 75, -60) -->
      <circle cx="75" cy="-60" r="7" fill="#141210" stroke="#93c5fd" stroke-width="1.2" />
      <text x="75" y="-57" font-size="9" font-family="serif" fill="#93c5fd" text-anchor="middle">♃</text>

      <!-- 3. Mars ♂ (102.8 deg: 93.7, 21.3) -->
      <circle cx="93.7" cy="21.3" r="7" fill="#141210" stroke="#fca5a5" stroke-width="1.2" />
      <text x="93.7" y="24.3" font-size="9" font-family="serif" fill="#fca5a5" text-anchor="middle">♂</text>

      <!-- 4. Sun ☉ (154.2 deg: 41.7, 86.4) -->
      <circle cx="41.7" cy="86.4" r="8" fill="#141210" stroke="#fde047" stroke-width="1.5" />
      <text x="41.7" y="89.4" font-size="10" font-family="serif" fill="#fde047" text-anchor="middle">☉</text>

      <!-- 5. Venus ♀ (205.7 deg: -41.7, 86.4) -->
      <circle cx="-41.7" cy="86.4" r="7" fill="#141210" stroke="#86efac" stroke-width="1.2" />
      <text x="-41.7" y="89.4" font-size="9" font-family="serif" fill="#86efac" text-anchor="middle">♀</text>

      <!-- 6. Mercury ☿ (257.1 deg: -93.7, 21.3) -->
      <circle cx="-93.7" cy="21.3" r="7" fill="#141210" stroke="#d8b4fe" stroke-width="1.2" />
      <text x="-93.7" y="24.3" font-size="9" font-family="serif" fill="#d8b4fe" text-anchor="middle">☿</text>

      <!-- 7. Moon ☽ (308.5 deg: -75, -60) -->
      <circle cx="-75" cy="-60" r="7" fill="#141210" stroke="#c7d2fe" stroke-width="1.2" />
      <text x="-75" y="-57" font-size="9" font-family="serif" fill="#c7d2fe" text-anchor="middle">☽</text>

      <!-- Heptagram Planetary Conduits -->
      <polygon points="0,-96 93.7,21.3 -41.7,86.4 -75,-60 75,-60 41.7,86.4 -93.7,21.3" fill="none" stroke="url(#chaldeanPlanets)" stroke-width="0.6" opacity="0.35" />
    </g>
  </g>

  <!-- Rotating Ring 3: Zodiac Decanate Wheel (Clockwise) -->
  <g class="spin-zodiac-ring">
    <g transform="translate(160, 160)">
      <circle r="68" stroke="url(#goldBrass)" stroke-width="1" opacity="0.6" />
      <circle r="50" stroke="#292524" stroke-width="0.75" />
      
      <!-- 12 Zodiac Houses Hexagram Matrix -->
      <polygon points="0,-68 58.9,34 -58.9,34" stroke="url(#goldBrass)" stroke-width="0.6" opacity="0.4" fill="none" />
      <polygon points="0,68 58.9,-34 -58.9,-34" stroke="url(#goldBrass)" stroke-width="0.6" opacity="0.4" fill="none" />
    </g>
  </g>

  <!-- Central Synodic Moon Oculus & Astrolabe Core -->
  <g class="pulse-center-moon">
    <g transform="translate(160, 160)">
      <!-- Outer Brass Oculus Bezel -->
      <circle r="36" fill="#141210" stroke="url(#goldBrass)" stroke-width="1.5" />
      <circle r="30" stroke="#292524" stroke-width="0.75" />
      
      <!-- Moon Phase Disc -->
      <circle r="22" fill="url(#moonGlow)" />
      <!-- Shadow Crescent Overlay -->
      <path d="M 0 -22 A 22 22 0 0 1 0 22 A 13 22 0 0 0 0 -22 Z" fill="#090d16" opacity="0.7" />

      <!-- Center Divine Spark -->
      <circle r="3.5" fill="#ffffff" />
      <circle r="1.5" fill="#fef08a" />
    </g>
  </g>

  <!-- Astrolabe Sighting Pointers (North/South/East/West) -->
  <g fill="url(#goldBrass)" opacity="0.8">
    <polygon points="160,18 156,26 164,26" />
    <polygon points="160,302 156,294 164,294" />
    <polygon points="18,160 26,156 26,164" />
    <polygon points="302,160 294,156 294,164" />
  </g>
</svg>
