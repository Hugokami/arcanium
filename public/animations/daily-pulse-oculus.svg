<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" fill="none">
  <defs>
    <!-- Solar Dawn Master Gradients -->
    <radialGradient id="dawnCorona" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.4" />
      <stop offset="35%" stop-color="#fb923c" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#1c1917" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0c0a09" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="solarGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="30%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <radialGradient id="irisInsight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fde047" />
      <stop offset="65%" stop-color="#d97706" />
      <stop offset="90%" stop-color="#141210" />
      <stop offset="100%" stop-color="#0c0a09" />
    </radialGradient>

    <filter id="solarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes sunRaysCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes zodiacCCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes eyePupilPulse {
        0%, 100% { transform: scale(0.9); opacity: 0.85; }
        50% { transform: scale(1.12); opacity: 1; filter: drop-shadow(0 0 12px rgba(253, 224, 71, 0.7)); }
      }
      @keyframes solarCoronaBreath {
        0%, 100% { opacity: 0.5; transform: scale(0.95); }
        50% { opacity: 0.9; transform: scale(1.05); }
      }

      .spin-solar-rays {
        animation: sunRaysCW 45s linear infinite;
        transform-origin: 160px 160px;
      }
      .spin-zodiac-crown {
        animation: zodiacCCW 30s linear infinite;
        transform-origin: 160px 160px;
      }
      .pulse-eye-core {
        animation: eyePupilPulse 3.6s ease-in-out infinite;
        transform-origin: 160px 160px;
      }
      .breath-corona {
        animation: solarCoronaBreath 4s ease-in-out infinite;
        transform-origin: 160px 160px;
      }
    </style>
  </defs>

  <!-- Ambient Solar Dawn Nebula -->
  <circle cx="160" cy="160" r="148" fill="url(#dawnCorona)" class="breath-corona" />

  <!-- Outer Machined Double Bezel -->
  <circle cx="160" cy="160" r="150" stroke="url(#solarGold)" stroke-width="1.5" opacity="0.75" />
  <circle cx="160" cy="160" r="144" stroke="#292524" stroke-width="1" />
  <circle cx="160" cy="160" r="140" stroke="url(#solarGold)" stroke-width="0.75" opacity="0.4" stroke-dasharray="3 2" />

  <!-- Rotating 16 Solar Flare Rays (Clockwise) -->
  <g class="spin-solar-rays" filter="url(#solarGlow)">
    <g transform="translate(160, 160)" stroke="url(#solarGold)" stroke-width="1" opacity="0.75">
      <!-- 16 Rays around 360 deg -->
      <line x1="0" y1="-136" x2="0" y2="-112" />
      <line x1="52" y1="-125.5" x2="42.8" y2="-103.4" />
      <line x1="96.1" y1="-96.1" x2="79.2" y2="-79.2" />
      <line x1="125.5" y1="-52" x2="103.4" y2="-42.8" />
      <line x1="136" y1="0" x2="112" y2="0" />
      <line x1="125.5" y1="52" x2="103.4" y2="42.8" />
      <line x1="96.1" y1="96.1" x2="79.2" y2="79.2" />
      <line x1="52" y1="125.5" x2="42.8" y2="103.4" />
      <line x1="0" y1="136" x2="0" y2="112" />
      <line x1="-52" y1="125.5" x2="-42.8" y2="103.4" />
      <line x1="-96.1" y1="96.1" x2="-79.2" y2="79.2" />
      <line x1="-125.5" y1="52" x2="-103.4" y2="42.8" />
      <line x1="-136" y1="0" x2="-112" y2="0" />
      <line x1="-125.5" y1="-52" x2="-103.4" y2="-42.8" />
      <line x1="-96.1" y1="-96.1" x2="-79.2" y2="-79.2" />
      <line x1="-52" y1="-125.5" x2="-42.8" y2="-103.4" />
    </g>
  </g>

  <!-- Rotating Inner Zodiac Astrolabe Crown (Counter-Clockwise) -->
  <g class="spin-zodiac-crown">
    <g transform="translate(160, 160)">
      <circle r="92" stroke="url(#solarGold)" stroke-width="1.2" opacity="0.6" />
      <circle r="72" stroke="#292524" stroke-width="0.75" />
      
      <!-- 12 Concentric Star Rays -->
      <polygon points="0,-88 22.7,-22.7 88,0 22.7,22.7 0,88 -22.7,22.7 -88,0 -22.7,-22.7" fill="none" stroke="url(#solarGold)" stroke-width="0.7" opacity="0.5" />
      <polygon points="0,-88 22.7,-22.7 88,0 22.7,22.7 0,88 -22.7,22.7 -88,0 -22.7,-22.7" transform="rotate(45)" fill="none" stroke="url(#solarGold)" stroke-width="0.7" opacity="0.5" />
    </g>
  </g>

  <!-- Central Third-Eye Intuition Oculus -->
  <g class="pulse-eye-core">
    <g transform="translate(160, 160)">
      <!-- Eyeball Almond Frame -->
      <path d="M -50 0 C -25 -32 25 -32 50 0 C 25 32 -25 32 -50 0 Z" fill="#141210" stroke="url(#solarGold)" stroke-width="1.5" />
      
      <!-- Iris Disc -->
      <circle r="20" fill="url(#irisInsight)" stroke="url(#solarGold)" stroke-width="1" />
      
      <!-- Pupil & Divine Spark -->
      <circle r="8" fill="#090d16" />
      <circle r="3" fill="#ffffff" />
      <circle r="1.2" fill="#fef08a" />
    </g>
  </g>

  <!-- Cardinal Degree Pointers -->
  <g fill="url(#solarGold)" opacity="0.8">
    <polygon points="160,20 156,28 164,28" />
    <polygon points="160,300 156,292 164,292" />
    <polygon points="20,160 28,156 28,164" />
    <polygon points="300,160 292,156 292,164" />
  </g>
</svg>
