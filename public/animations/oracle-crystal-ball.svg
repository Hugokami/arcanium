<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="sphereAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#07040f" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="crystalInterior" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f5d0fe" />
      <stop offset="25%" stop-color="#c084fc" />
      <stop offset="60%" stop-color="#6366f1" />
      <stop offset="85%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090514" />
    </radialGradient>

    <linearGradient id="orbStandGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="40%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <filter id="ballGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .sphere-float {
        animation: floatSphere 4s ease-in-out infinite;
        transform-origin: 50px 45px;
      }
      .galaxy-swirl {
        animation: spinGalaxy 14s linear infinite;
        transform-origin: 50px 45px;
      }
      .sparkle-dot {
        animation: blinkSpark 2.5s ease-in-out infinite;
      }

      @keyframes floatSphere {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); filter: drop-shadow(0 0 12px rgba(168,85,247,0.7)); }
      }
      @keyframes spinGalaxy {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes blinkSpark {
        0%, 100% { opacity: 0.2; transform: scale(0.6); }
        50% { opacity: 1; transform: scale(1.3); }
      }
    </style>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="50" cy="48" r="44" fill="url(#sphereAura)" />

  <!-- Tripod Stand (Bottom) -->
  <path d="M32 78 Q50 72 68 78 L65 84 Q50 80 35 84 Z" fill="url(#orbStandGold)" stroke="#d4af37" stroke-width="0.8" />
  <circle cx="50" cy="74" r="3" fill="#fde047" />

  <!-- Floating Crystal Sphere Group -->
  <g class="sphere-float" filter="url(#ballGlow)">
    <!-- Main Glass Orb -->
    <circle cx="50" cy="45" r="28" fill="url(#crystalInterior)" stroke="url(#orbStandGold)" stroke-width="1.4" />

    <!-- Interior Swirling Nebula & Stardust -->
    <g class="galaxy-swirl" clip-path="url(#sphereClip)">
      <clipPath id="sphereClip">
        <circle cx="50" cy="45" r="26.5" />
      </clipPath>

      <path d="M50 45 C38 32, 28 45, 50 45 C72 45, 62 58, 50 45 Z" stroke="#ffffff" stroke-width="1.2" fill="none" opacity="0.6" stroke-dasharray="3 4" />
      <circle cx="42" cy="38" r="2" fill="#ffffff" />
      <circle cx="58" cy="52" r="1.5" fill="#fde047" />
      <circle cx="50" cy="45" r="3" fill="#ffffff" opacity="0.9" />
    </g>

    <!-- Glass Specular Reflection Crescent -->
    <path d="M32 30 C38 22, 50 20, 60 23 C52 22, 38 26, 32 35 Z" fill="#ffffff" opacity="0.65" />
  </g>

  <!-- Twinkling Stardust Sparkles -->
  <g class="sparkle-dot" transform="translate(18, 22)">
    <path d="M0 -3.5 Q0 0 3.5 0 Q0 0 0 3.5 Q0 0 -3.5 0 Q0 0 0 -3.5 Z" fill="#f5d0fe" />
  </g>
  <g class="sparkle-dot" transform="translate(82, 26)" style="animation-delay: 1.2s;">
    <path d="M0 -3.5 Q0 0 3.5 0 Q0 0 0 3.5 Q0 0 -3.5 0 Q0 0 0 -3.5 Z" fill="#fde047" />
  </g>
</svg>
