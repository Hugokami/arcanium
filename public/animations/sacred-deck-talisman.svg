<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="talisman-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241042" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#110722" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#07030e" stop-opacity="1" />
    </radialGradient>

    <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="40%" stop-color="#fde047" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0" />
    </radialGradient>

    <filter id="cube-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes rotate-metatron {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes counter-rotate {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes pulse-tetrahedron {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
    }
    @keyframes node-breathe {
      0%, 100% { r: 5px; opacity: 0.7; }
      50% { r: 7.5px; opacity: 1; }
    }

    .meta-outer {
      transform-origin: 200px 200px;
      animation: rotate-metatron 48s linear infinite;
    }
    .meta-inner {
      transform-origin: 200px 200px;
      animation: counter-rotate 32s linear infinite;
    }
    .meta-core {
      transform-origin: 200px 200px;
      animation: pulse-tetrahedron 5s ease-in-out infinite;
    }
    .node-anim {
      animation: node-breathe 3s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <circle cx="200" cy="200" r="185" fill="url(#talisman-bg)" stroke="#d4af37" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Outer Ring with Sacred Inscriptions -->
  <g class="meta-outer">
    <circle cx="200" cy="200" r="172" fill="none" stroke="#d4af37" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="200" cy="200" r="164" fill="none" stroke="#fef08a" stroke-width="0.8" stroke-dasharray="4,8" stroke-opacity="0.6" />
    <circle cx="200" cy="200" r="150" fill="none" stroke="#d4af37" stroke-width="0.6" stroke-opacity="0.3" />

    <!-- 6 Hexagonal Outer Nodes (Fruit of Life Outer Ring) -->
    <!-- 0 deg -->
    <circle cx="200" cy="50" r="14" fill="#150a2a" stroke="#d4af37" stroke-width="1.5" />
    <circle cx="200" cy="50" r="4" fill="#ffffff" filter="url(#cube-glow)" />

    <!-- 60 deg -->
    <circle cx="330" cy="125" r="14" fill="#150a2a" stroke="#d4af37" stroke-width="1.5" />
    <circle cx="330" cy="125" r="4" fill="#ffffff" filter="url(#cube-glow)" />

    <!-- 120 deg -->
    <circle cx="330" cy="275" r="14" fill="#150a2a" stroke="#d4af37" stroke-width="1.5" />
    <circle cx="330" cy="275" r="4" fill="#ffffff" filter="url(#cube-glow)" />

    <!-- 180 deg -->
    <circle cx="200" cy="350" r="14" fill="#150a2a" stroke="#d4af37" stroke-width="1.5" />
    <circle cx="200" cy="350" r="4" fill="#ffffff" filter="url(#cube-glow)" />

    <!-- 240 deg -->
    <circle cx="70" cy="275" r="14" fill="#150a2a" stroke="#d4af37" stroke-width="1.5" />
    <circle cx="70" cy="275" r="4" fill="#ffffff" filter="url(#cube-glow)" />

    <!-- 300 deg -->
    <circle cx="70" cy="125" r="14" fill="#150a2a" stroke="#d4af37" stroke-width="1.5" />
    <circle cx="70" cy="125" r="4" fill="#ffffff" filter="url(#cube-glow)" />

    <!-- Outer Hexagram Vectors Connecting Outer 6 Nodes -->
    <polygon points="200,50 330,275 70,275" fill="none" stroke="#d4af37" stroke-width="1" stroke-opacity="0.6" />
    <polygon points="200,350 330,125 70,125" fill="none" stroke="#d4af37" stroke-width="1" stroke-opacity="0.6" />
  </g>

  <!-- Middle Inner Metatron's Intersecting Vector Grid -->
  <g class="meta-inner">
    <!-- Inner Hexagon Connecting 6 Inner Nodes -->
    <!-- 0 deg -->
    <line x1="200" y1="125" x2="265" y2="162.5" stroke="#fef08a" stroke-width="1" stroke-opacity="0.5" />
    <line x1="265" y1="162.5" x2="265" y2="237.5" stroke="#fef08a" stroke-width="1" stroke-opacity="0.5" />
    <line x1="265" y1="237.5" x2="200" y2="275" stroke="#fef08a" stroke-width="1" stroke-opacity="0.5" />
    <line x1="200" y1="275" x2="135" y2="237.5" stroke="#fef08a" stroke-width="1" stroke-opacity="0.5" />
    <line x1="135" y1="237.5" x2="135" y2="162.5" stroke="#fef08a" stroke-width="1" stroke-opacity="0.5" />
    <line x1="135" y1="162.5" x2="200" y2="125" stroke="#fef08a" stroke-width="1" stroke-opacity="0.5" />

    <!-- 6 Diametral Lines through Center -->
    <line x1="200" y1="50" x2="200" y2="350" stroke="#d4af37" stroke-width="0.8" stroke-opacity="0.4" />
    <line x1="330" y1="125" x2="70" y2="275" stroke="#d4af37" stroke-width="0.8" stroke-opacity="0.4" />
    <line x1="330" y1="275" x2="70" y2="125" stroke="#d4af37" stroke-width="0.8" stroke-opacity="0.4" />

    <!-- Inner 6 Nodes -->
    <circle cx="200" cy="125" r="10" fill="#1a0d33" stroke="#fef08a" stroke-width="1.2" />
    <circle cx="265" cy="162.5" r="10" fill="#1a0d33" stroke="#fef08a" stroke-width="1.2" />
    <circle cx="265" cy="237.5" r="10" fill="#1a0d33" stroke="#fef08a" stroke-width="1.2" />
    <circle cx="200" cy="275" r="10" fill="#1a0d33" stroke="#fef08a" stroke-width="1.2" />
    <circle cx="135" cy="237.5" r="10" fill="#1a0d33" stroke="#fef08a" stroke-width="1.2" />
    <circle cx="135" cy="162.5" r="10" fill="#1a0d33" stroke="#fef08a" stroke-width="1.2" />
  </g>

  <!-- Central Star of David Core Node (13th Spherical Singularity) -->
  <g class="meta-core">
    <circle cx="200" cy="200" r="32" fill="url(#node-glow)" filter="url(#cube-glow)" />
    <circle cx="200" cy="200" r="18" fill="#160a2c" stroke="#d4af37" stroke-width="2" />
    <circle cx="200" cy="200" r="6" fill="#ffffff" />
  </g>
</svg>
