<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="celticGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <filter id="celticGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .celtic-center {
        animation: breathCenter 4s ease-in-out infinite;
        transform-origin: 32px 40px;
      }
      .staff-outcome {
        animation: pulseOutcome 3s ease-in-out infinite;
        transform-origin: 80px 14px;
      }
      .celtic-ring {
        animation: spinCeltic 20s linear infinite;
        transform-origin: 32px 40px;
      }

      @keyframes breathCenter {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); filter: drop-shadow(0 0 6px rgba(212,175,55,0.7)); }
      }
      @keyframes pulseOutcome {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.08); filter: drop-shadow(0 0 8px #fde047); }
      }
      @keyframes spinCeltic {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <!-- Left: Celtic Cross Sacred Circle -->
  <g class="celtic-ring">
    <circle cx="32" cy="40" r="22" stroke="#d4af37" stroke-width="0.6" stroke-dasharray="2 3" opacity="0.5" />
  </g>

  <!-- Left: The Sacred Cross (Positions 1-6) -->
  <!-- 5. Crown (Top) -->
  <rect x="25" y="8" width="14" height="20" rx="2" fill="#0d081e" stroke="#d4af37" stroke-width="0.75" opacity="0.8" />
  <!-- 3. Root (Bottom) -->
  <rect x="25" y="52" width="14" height="20" rx="2" fill="#0d081e" stroke="#d4af37" stroke-width="0.75" opacity="0.8" />
  <!-- 4. Past (Left) -->
  <rect x="8" y="30" width="14" height="20" rx="2" fill="#0d081e" stroke="#d4af37" stroke-width="0.75" opacity="0.8" />
  <!-- 6. Future (Right) -->
  <rect x="42" y="30" width="14" height="20" rx="2" fill="#0d081e" stroke="#d4af37" stroke-width="0.75" opacity="0.8" />

  <!-- 1. Present + 2. Crossing Obstacle Center -->
  <g class="celtic-center" filter="url(#celticGlow)">
    <rect x="24" y="29" width="16" height="22" rx="2.5" fill="#180e30" stroke="url(#celticGold)" stroke-width="1.2" />
    <!-- Crossing Obstacle Card (Rotated 90 deg across) -->
    <rect x="21" y="33" width="22" height="14" rx="2" fill="#281440" stroke="#fef08a" stroke-width="0.8" opacity="0.9" />
    <circle cx="32" cy="40" r="2.5" fill="#ffffff" />
  </g>

  <!-- Right: Vertical Destiny Staff (Positions 7-10) -->
  <!-- 10. Outcome (Top Master Card) -->
  <g class="staff-outcome" filter="url(#celticGlow)">
    <rect x="73" y="6" width="14" height="16" rx="2" fill="#1a0f30" stroke="url(#celticGold)" stroke-width="1.1" />
    <circle cx="80" cy="14" r="2" fill="#fde047" />
  </g>
  <!-- 9. Hopes & Fears -->
  <rect x="73" y="24" width="14" height="14" rx="2" fill="#0d081e" stroke="#c084fc" stroke-width="0.75" opacity="0.85" />
  <!-- 8. Environment -->
  <rect x="73" y="40" width="14" height="14" rx="2" fill="#0d081e" stroke="#c084fc" stroke-width="0.75" opacity="0.85" />
  <!-- 7. Self / Querent -->
  <rect x="73" y="56" width="14" height="14" rx="2" fill="#0d081e" stroke="#c084fc" stroke-width="0.75" opacity="0.85" />
</svg>
