<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="chakraSpine" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="17%" stop-color="#f97316" />
      <stop offset="34%" stop-color="#eab308" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="67%" stop-color="#06b6d4" />
      <stop offset="84%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <filter id="chakraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .chakra-wave {
        animation: waveTravel 3s linear infinite;
      }
      .node-crown { animation: pulseNode 2.5s ease-in-out infinite; }
      .node-heart { animation: pulseNode 2.5s ease-in-out 0.8s infinite; }
      .node-root { animation: pulseNode 2.5s ease-in-out 1.6s infinite; }

      @keyframes waveTravel {
        0% { stroke-dashoffset: 60; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.3); opacity: 1; filter: drop-shadow(0 0 4px #ffffff); }
      }
    </style>
  </defs>

  <!-- Central Prismatic Spinal Beam -->
  <line x1="50" y1="8" x2="50" y2="72" stroke="url(#chakraSpine)" stroke-width="1.8" stroke-linecap="round" />
  <line x1="50" y1="8" x2="50" y2="72" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="4 6" class="chakra-wave" opacity="0.9" />

  <!-- 7 Ascending Chakra Cards & Nodes -->
  <!-- 7. Crown (Purple) -->
  <rect x="36" y="6" width="28" height="7.5" rx="2" fill="#2e1065" stroke="#c084fc" stroke-width="0.7" opacity="0.9" />
  <circle cx="50" cy="9.75" r="2.2" fill="#c084fc" class="node-crown" filter="url(#chakraGlow)" />

  <!-- 6. Third Eye (Indigo) -->
  <rect x="37" y="16" width="26" height="7.5" rx="2" fill="#1e1b4b" stroke="#818cf8" stroke-width="0.7" opacity="0.9" />
  <circle cx="50" cy="19.75" r="1.8" fill="#818cf8" />

  <!-- 5. Throat (Cyan) -->
  <rect x="37" y="26" width="26" height="7.5" rx="2" fill="#083344" stroke="#22d3ee" stroke-width="0.7" opacity="0.9" />
  <circle cx="50" cy="29.75" r="1.8" fill="#22d3ee" />

  <!-- 4. Heart (Emerald) -->
  <rect x="35" y="36" width="30" height="8" rx="2" fill="#064e3b" stroke="#34d399" stroke-width="0.8" opacity="0.95" />
  <circle cx="50" cy="40" r="2.2" fill="#34d399" class="node-heart" filter="url(#chakraGlow)" />

  <!-- 3. Solar Plexus (Yellow) -->
  <rect x="37" y="46.5" width="26" height="7.5" rx="2" fill="#422006" stroke="#facc15" stroke-width="0.7" opacity="0.9" />
  <circle cx="50" cy="50.25" r="1.8" fill="#facc15" />

  <!-- 2. Sacral (Orange) -->
  <rect x="37" y="56.5" width="26" height="7.5" rx="2" fill="#431407" stroke="#fb923c" stroke-width="0.7" opacity="0.9" />
  <circle cx="50" cy="60.25" r="1.8" fill="#fb923c" />

  <!-- 1. Root (Red) -->
  <rect x="36" y="66.5" width="28" height="7.5" rx="2" fill="#450a0a" stroke="#f87171" stroke-width="0.7" opacity="0.9" />
  <circle cx="50" cy="70.25" r="2.2" fill="#f87171" class="node-root" filter="url(#chakraGlow)" />
</svg>
