<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="chakraSpine" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="17%" stop-color="#f97316" />
      <stop offset="34%" stop-color="#eab308" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="67%" stop-color="#06b6d4" />
      <stop offset="84%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <filter id="chakraGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .chakra-wave {
        animation: waveTravel 3s linear infinite;
      }
      .node-crown { animation: pulseChakraNode 2.4s ease-in-out infinite; transform-origin: 50px 7px; }
      .node-thirdeye { animation: pulseChakraNode 2.4s ease-in-out 0.4s infinite; transform-origin: 50px 17px; }
      .node-throat { animation: pulseChakraNode 2.4s ease-in-out 0.8s infinite; transform-origin: 50px 27px; }
      .node-heart { animation: pulseChakraNode 2.4s ease-in-out 1.2s infinite; transform-origin: 50px 38px; }
      .node-solar { animation: pulseChakraNode 2.4s ease-in-out 1.6s infinite; transform-origin: 50px 49px; }
      .node-sacral { animation: pulseChakraNode 2.4s ease-in-out 2.0s infinite; transform-origin: 50px 60px; }
      .node-root { animation: pulseChakraNode 2.4s ease-in-out 2.4s infinite; transform-origin: 50px 71px; }

      @keyframes waveTravel {
        0% { stroke-dashoffset: 70; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseChakraNode {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.35); opacity: 1; filter: drop-shadow(0 0 5px #ffffff); }
      }
    </style>
  </defs>

  <!-- Central Prismatic Kundalini Light Spine -->
  <line x1="50" y1="4" x2="50" y2="76" stroke="url(#chakraSpine)" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="4" x2="50" y2="76" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="4 6" class="chakra-wave" opacity="0.9" />

  <!-- 7 Ascending Chakra Tarot Cards (Position 1 to 7) -->
  
  <!-- 7. Crown Chakra (Purple / Sahasrara) -->
  <g class="node-crown">
    <rect x="32" y="3" width="36" height="8.5" rx="2" fill="#2e1065" stroke="#c084fc" stroke-width="0.85" />
    <circle cx="50" cy="7.25" r="2.2" fill="#e9d5ff" filter="url(#chakraGlow)" />
    <line x1="36" y1="7.25" x2="44" y2="7.25" stroke="#c084fc" stroke-width="0.6" stroke-opacity="0.7" />
    <line x1="56" y1="7.25" x2="64" y2="7.25" stroke="#c084fc" stroke-width="0.6" stroke-opacity="0.7" />
  </g>

  <!-- 6. Third Eye Chakra (Indigo / Ajna) -->
  <g class="node-thirdeye">
    <rect x="33" y="13.5" width="34" height="8.5" rx="2" fill="#1e1b4b" stroke="#818cf8" stroke-width="0.8" />
    <circle cx="50" cy="17.75" r="2" fill="#c7d2fe" />
    <line x1="37" y1="17.75" x2="44" y2="17.75" stroke="#818cf8" stroke-width="0.5" stroke-opacity="0.7" />
    <line x1="56" y1="17.75" x2="63" y2="17.75" stroke="#818cf8" stroke-width="0.5" stroke-opacity="0.7" />
  </g>

  <!-- 5. Throat Chakra (Cyan / Vishuddha) -->
  <g class="node-throat">
    <rect x="33" y="24" width="34" height="8.5" rx="2" fill="#083344" stroke="#22d3ee" stroke-width="0.8" />
    <circle cx="50" cy="28.25" r="2" fill="#a5f3fc" />
    <line x1="37" y1="28.25" x2="44" y2="28.25" stroke="#22d3ee" stroke-width="0.5" stroke-opacity="0.7" />
    <line x1="56" y1="28.25" x2="63" y2="28.25" stroke="#22d3ee" stroke-width="0.5" stroke-opacity="0.7" />
  </g>

  <!-- 4. Heart Chakra (Emerald / Anahata) - Center Jewel -->
  <g class="node-heart">
    <rect x="31" y="34.5" width="38" height="9" rx="2.5" fill="#064e3b" stroke="#34d399" stroke-width="1.1" />
    <circle cx="50" cy="39" r="2.5" fill="#6ee7b7" filter="url(#chakraGlow)" />
    <line x1="35" y1="39" x2="44" y2="39" stroke="#34d399" stroke-width="0.7" stroke-opacity="0.8" />
    <line x1="56" y1="39" x2="65" y2="39" stroke="#34d399" stroke-width="0.7" stroke-opacity="0.8" />
  </g>

  <!-- 3. Solar Plexus Chakra (Yellow / Manipura) -->
  <g class="node-solar">
    <rect x="33" y="45.5" width="34" height="8.5" rx="2" fill="#422006" stroke="#facc15" stroke-width="0.8" />
    <circle cx="50" cy="49.75" r="2" fill="#fef08a" />
    <line x1="37" y1="49.75" x2="44" y2="49.75" stroke="#facc15" stroke-width="0.5" stroke-opacity="0.7" />
    <line x1="56" y1="49.75" x2="63" y2="49.75" stroke="#facc15" stroke-width="0.5" stroke-opacity="0.7" />
  </g>

  <!-- 2. Sacral Chakra (Orange / Svadhisthana) -->
  <g class="node-sacral">
    <rect x="33" y="56" width="34" height="8.5" rx="2" fill="#431407" stroke="#fb923c" stroke-width="0.8" />
    <circle cx="50" cy="60.25" r="2" fill="#fed7aa" />
    <line x1="37" y1="60.25" x2="44" y2="60.25" stroke="#fb923c" stroke-width="0.5" stroke-opacity="0.7" />
    <line x1="56" y1="60.25" x2="63" y2="60.25" stroke="#fb923c" stroke-width="0.5" stroke-opacity="0.7" />
  </g>

  <!-- 1. Root Chakra (Red / Muladhara) -->
  <g class="node-root">
    <rect x="32" y="66.5" width="36" height="8.5" rx="2" fill="#450a0a" stroke="#f87171" stroke-width="0.85" />
    <circle cx="50" cy="70.75" r="2.2" fill="#fca5a5" filter="url(#chakraGlow)" />
    <line x1="36" y1="70.75" x2="44" y2="70.75" stroke="#f87171" stroke-width="0.6" stroke-opacity="0.7" />
    <line x1="56" y1="70.75" x2="64" y2="70.75" stroke="#f87171" stroke-width="0.6" stroke-opacity="0.7" />
  </g>
</svg>
