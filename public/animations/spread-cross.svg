<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="crossGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <filter id="crossGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .center-card {
        animation: pulseCore 3.5s ease-in-out infinite;
        transform-origin: 50px 40px;
      }
      .outer-cross-orbit {
        animation: spinCross 24s linear infinite;
        transform-origin: 50px 40px;
      }
      @keyframes pulseCore {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px rgba(212,175,55,0.4)); }
        50% { transform: scale(1.06); filter: drop-shadow(0 0 10px rgba(212,175,55,0.8)); }
      }
      @keyframes spinCross {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <!-- Elemental Orbital Matrix -->
  <g class="outer-cross-orbit">
    <circle cx="50" cy="40" r="32" stroke="#d4af37" stroke-width="0.7" stroke-dasharray="2 4" opacity="0.5" />
    <circle cx="50" cy="8" r="1.5" fill="#f87171" />
    <circle cx="82" cy="40" r="1.5" fill="#60a5fa" />
    <circle cx="50" cy="72" r="1.5" fill="#34d399" />
    <circle cx="18" cy="40" r="1.5" fill="#fbbf24" />
  </g>

  <!-- 4 Directional Cards (North, South, East, West) -->
  <!-- North -->
  <rect x="42" y="6" width="16" height="24" rx="2.5" fill="#0d081e" stroke="#d4af37" stroke-width="0.8" opacity="0.85" />
  <!-- South -->
  <rect x="42" y="50" width="16" height="24" rx="2.5" fill="#0d081e" stroke="#d4af37" stroke-width="0.8" opacity="0.85" />
  <!-- West -->
  <rect x="18" y="28" width="16" height="24" rx="2.5" fill="#0d081e" stroke="#d4af37" stroke-width="0.8" opacity="0.85" />
  <!-- East -->
  <rect x="66" y="28" width="16" height="24" rx="2.5" fill="#0d081e" stroke="#d4af37" stroke-width="0.8" opacity="0.85" />

  <!-- Center Core Card -->
  <g class="center-card" filter="url(#crossGlow)">
    <rect x="40" y="26" width="20" height="28" rx="3" fill="#180e30" stroke="url(#crossGold)" stroke-width="1.3" />
    <circle cx="50" cy="40" r="3.5" stroke="#fef08a" stroke-width="0.7" fill="rgba(212, 175, 55, 0.3)" />
    <circle cx="50" cy="40" r="1.2" fill="#ffffff" />
  </g>
</svg>
