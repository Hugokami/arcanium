<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="relGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="35%" stop-color="#fb7185" />
      <stop offset="70%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <radialGradient id="heartAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#d4af37" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#07040f" stop-opacity="0" />
    </radialGradient>

    <filter id="relGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .rel-bond-card {
        animation: bondPulse 3.5s ease-in-out infinite;
        transform-origin: 50px 40px;
      }
      .partner-left {
        animation: partnerSwayL 4s ease-in-out infinite;
        transform-origin: 18px 40px;
      }
      .partner-right {
        animation: partnerSwayR 4s ease-in-out 0.5s infinite;
        transform-origin: 82px 40px;
      }
      .challenge-card {
        animation: challengeFloat 3.8s ease-in-out 0.8s infinite;
        transform-origin: 50px 14px;
      }
      .forward-card {
        animation: forwardFloat 3.8s ease-in-out 1.2s infinite;
        transform-origin: 50px 66px;
      }
      .twin-flame-beam {
        animation: beamPulse 3s ease-in-out infinite;
      }

      @keyframes bondPulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(251,113,133,0.5)); }
        50% { transform: scale(1.06); filter: drop-shadow(0 0 12px rgba(212,175,55,0.8)); }
      }
      @keyframes partnerSwayL {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-2px) rotate(-1.5deg); }
      }
      @keyframes partnerSwayR {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-2px) rotate(1.5deg); }
      }
      @keyframes challengeFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-2.5px); }
      }
      @keyframes forwardFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(2.5px); }
      }
      @keyframes beamPulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.9; }
      }
    </style>
  </defs>

  <!-- Ambient Resonance Aura -->
  <circle cx="50" cy="40" r="32" fill="url(#heartAura)" />

  <!-- Connecting Twin-Flame Resonance Arch Lines -->
  <path d="M18 40 Q50 25 82 40" stroke="url(#relGrad)" stroke-width="0.9" stroke-dasharray="3 3" class="twin-flame-beam" fill="none" />
  <path d="M18 40 Q50 55 82 40" stroke="url(#relGrad)" stroke-width="0.9" stroke-dasharray="3 3" class="twin-flame-beam" fill="none" />

  <!-- 1. Left: YOU (Position 1) -->
  <g class="partner-left">
    <rect x="9" y="27" width="18" height="26" rx="2.5" fill="#150a26" stroke="#c084fc" stroke-width="0.9" opacity="0.9" />
    <circle cx="18" cy="40" r="3" stroke="#e9d5ff" stroke-width="0.6" fill="rgba(192, 132, 252, 0.3)" />
    <circle cx="18" cy="40" r="1.2" fill="#ffffff" />
  </g>

  <!-- 2. Right: THEM (Position 2) -->
  <g class="partner-right">
    <rect x="73" y="27" width="18" height="26" rx="2.5" fill="#150a26" stroke="#f472b6" stroke-width="0.9" opacity="0.9" />
    <circle cx="82" cy="40" r="3" stroke="#fbcfe8" stroke-width="0.6" fill="rgba(244, 114, 182, 0.3)" />
    <circle cx="82" cy="40" r="1.2" fill="#ffffff" />
  </g>

  <!-- 4. Top: THE CHALLENGE (Position 4) -->
  <g class="challenge-card">
    <rect x="41" y="4" width="18" height="20" rx="2" fill="#0f0720" stroke="#fb7185" stroke-width="0.8" opacity="0.85" />
    <line x1="46" y1="14" x2="54" y2="14" stroke="#fca5a5" stroke-width="0.8" />
  </g>

  <!-- 5. Bottom: THE PATH FORWARD (Position 5) -->
  <g class="forward-card">
    <rect x="41" y="56" width="18" height="20" rx="2" fill="#0f0720" stroke="#34d399" stroke-width="0.8" opacity="0.85" />
    <path d="M50 62 L54 67 L46 67 Z" fill="#6ee7b7" />
  </g>

  <!-- 3. Center: THE BOND (Position 3 - Elevated Core) -->
  <g class="rel-bond-card" filter="url(#relGlow)">
    <rect x="39" y="25" width="22" height="30" rx="3" fill="#200d33" stroke="url(#relGrad)" stroke-width="1.3" />
    <!-- Glowing Twin-Flame Nexus Core -->
    <path d="M47 38 C47 36 49 35 50 36.5 C51 35 53 36 53 38 C53 40.5 50 43 50 43 C50 43 47 40.5 47 38 Z" fill="#fb7185" />
    <circle cx="50" cy="38" r="1.5" fill="#fffbeb" />
  </g>
</svg>
