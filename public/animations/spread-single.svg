<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="singleAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#8a5cf6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#07040f" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="cardBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="40%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <filter id="glowSingle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .floating-card {
        animation: floatCard 3.5s ease-in-out infinite;
        transform-origin: 50px 40px;
      }
      .orbit-ring {
        animation: spinOrbit 16s linear infinite;
        transform-origin: 50px 40px;
      }
      .twinkle-dot {
        animation: blinkStar 2.2s ease-in-out infinite;
      }

      @keyframes floatCard {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-4px) rotate(1deg); filter: drop-shadow(0 0 8px rgba(212,175,55,0.6)); }
      }
      @keyframes spinOrbit {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes blinkStar {
        0%, 100% { opacity: 0.2; transform: scale(0.6); }
        50% { opacity: 1; transform: scale(1.2); }
      }
    </style>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="50" cy="40" r="36" fill="url(#singleAura)" />

  <!-- Orbiting Constellation Ring -->
  <g class="orbit-ring">
    <ellipse cx="50" cy="40" rx="36" ry="18" stroke="#d4af37" stroke-width="0.75" stroke-dasharray="4 6" stroke-opacity="0.6" transform="rotate(-15 50 40)" />
    <circle cx="85" cy="30" r="1.8" fill="#fffbeb" filter="url(#glowSingle)" />
    <circle cx="15" cy="50" r="1.5" fill="#fde047" />
  </g>

  <!-- Floating Mystic Card -->
  <g class="floating-card" filter="url(#glowSingle)">
    <!-- Card Body -->
    <rect x="36" y="16" width="28" height="46" rx="4" fill="#0d081e" stroke="url(#cardBorderGrad)" stroke-width="1.2" />
    <rect x="39" y="19" width="22" height="40" rx="2" fill="none" stroke="#d4af37" stroke-width="0.5" stroke-dasharray="2 2" stroke-opacity="0.7" />

    <!-- Card Face Art: Mystic Sun & Eye -->
    <circle cx="50" cy="39" r="6" stroke="#fef08a" stroke-width="0.8" fill="rgba(212, 175, 55, 0.2)" />
    <circle cx="50" cy="39" r="2.2" fill="#ffffff" />
    <line x1="50" y1="28" x2="50" y2="31" stroke="#fde047" stroke-width="0.8" stroke-linecap="round" />
    <line x1="50" y1="47" x2="50" y2="50" stroke="#fde047" stroke-width="0.8" stroke-linecap="round" />
    <line x1="39" y1="39" x2="42" y2="39" stroke="#fde047" stroke-width="0.8" stroke-linecap="round" />
    <line x1="58" y1="39" x2="61" y2="39" stroke="#fde047" stroke-width="0.8" stroke-linecap="round" />
  </g>
</svg>
