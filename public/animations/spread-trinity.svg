<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="goldBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <filter id="trinityGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .card-left {
        animation: floatL 4s ease-in-out infinite;
        transform-origin: 22px 42px;
      }
      .card-center {
        animation: floatC 4s ease-in-out 0.5s infinite;
        transform-origin: 50px 38px;
      }
      .card-right {
        animation: floatR 4s ease-in-out 1s infinite;
        transform-origin: 78px 42px;
      }
      .flow-beam {
        animation: dashBeam 3s linear infinite;
      }

      @keyframes floatL {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes floatC {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-5px) scale(1.04); filter: drop-shadow(0 0 8px rgba(212,175,55,0.7)); }
      }
      @keyframes floatR {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes dashBeam {
        0% { stroke-dashoffset: 24; }
        100% { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <!-- Connecting Constellation Flow Beam -->
  <path d="M22 42 Q50 34 78 42" stroke="url(#goldBeam)" stroke-width="1.2" stroke-dasharray="4 3" class="flow-beam" fill="none" opacity="0.8" />

  <!-- Card 1: Past (Left) -->
  <g class="card-left">
    <rect x="12" y="24" width="20" height="34" rx="3" fill="#0d081e" stroke="#a78bfa" stroke-width="0.9" opacity="0.85" />
    <circle cx="22" cy="41" r="3.5" stroke="#c084fc" stroke-width="0.6" fill="rgba(167, 139, 250, 0.2)" />
    <circle cx="22" cy="41" r="1.2" fill="#fffbeb" />
  </g>

  <!-- Card 2: Present (Center Elevated) -->
  <g class="card-center" filter="url(#trinityGlow)">
    <rect x="38" y="16" width="24" height="42" rx="3.5" fill="#160e2e" stroke="url(#goldBeam)" stroke-width="1.4" />
    <rect x="41" y="19" width="18" height="36" rx="2" fill="none" stroke="#fef08a" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.7" />
    <circle cx="50" cy="37" r="5" stroke="#fef08a" stroke-width="0.8" fill="rgba(212, 175, 55, 0.25)" />
    <circle cx="50" cy="37" r="1.8" fill="#ffffff" />
  </g>

  <!-- Card 3: Future (Right) -->
  <g class="card-right">
    <rect x="68" y="24" width="20" height="34" rx="3" fill="#0d081e" stroke="#fb7185" stroke-width="0.9" opacity="0.85" />
    <circle cx="78" cy="41" r="3.5" stroke="#fda4af" stroke-width="0.6" fill="rgba(251, 113, 133, 0.2)" />
    <circle cx="78" cy="41" r="1.2" fill="#fffbeb" />
  </g>
</svg>
