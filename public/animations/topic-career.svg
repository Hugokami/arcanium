<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Warm Amber & Solar Gold Gradients -->
    <radialGradient id="careerAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#b45309" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="astrolabeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="needleGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="30%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <filter id="amberGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="needleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .bg-aura {
        animation: pulseCareerAura 4s ease-in-out infinite;
        transform-origin: center;
      }
      .outer-astrolabe-ring {
        animation: rotateAstrolabeClockwise 28s linear infinite;
        transform-origin: 60px 60px;
      }
      .inner-reticle-ring {
        animation: rotateAstrolabeCounter 18s linear infinite;
        transform-origin: 60px 60px;
      }
      .compass-star-needle {
        animation: oscillateNeedle 6s ease-in-out infinite;
        transform-origin: 60px 60px;
      }
      .core-pulsar {
        animation: corePulse 2.5s ease-in-out infinite;
        transform-origin: 60px 60px;
      }
      .star-twinkle-1 {
        animation: starBlink 2.4s ease-in-out infinite;
      }
      .star-twinkle-2 {
        animation: starBlink 3s ease-in-out 1s infinite;
      }

      @keyframes rotateAstrolabeClockwise {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes rotateAstrolabeCounter {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(-360deg); }
      }
      @keyframes oscillateNeedle {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(14deg); }
        70% { transform: rotate(-10deg); }
      }
      @keyframes pulseCareerAura {
        0%, 100% { transform: scale(0.94); opacity: 0.7; }
        50% { transform: scale(1.12); opacity: 1; }
      }
      @keyframes corePulse {
        0%, 100% { transform: scale(0.9); opacity: 0.8; }
        50% { transform: scale(1.25); opacity: 1; filter: drop-shadow(0 0 6px #fef08a); }
      }
      @keyframes starBlink {
        0%, 100% { opacity: 0.2; transform: scale(0.7); }
        50% { opacity: 1; transform: scale(1.2); }
      }
    </style>
  </defs>

  <!-- Ambient Amber Glow -->
  <circle cx="60" cy="60" r="54" fill="url(#careerAura)" class="bg-aura" />

  <!-- Outer Armillary Sphere Throne -->
  <circle cx="60" cy="60" r="52" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="0.75" />
  <circle cx="60" cy="60" r="48" stroke="url(#astrolabeGold)" stroke-width="1.2" stroke-opacity="0.85" />
  
  <!-- Outer Degree Marker Ring -->
  <g class="outer-astrolabe-ring">
    <circle cx="60" cy="60" r="44" stroke="#d4af37" stroke-width="0.8" stroke-dasharray="2 4 1 4" stroke-opacity="0.6" />
    <circle cx="60" cy="60" r="40" stroke="#fef08a" stroke-width="0.5" stroke-opacity="0.4" />
    
    <!-- 12 Cardinal Astrological Ticks -->
    <line x1="60" y1="12" x2="60" y2="17" stroke="#fef08a" stroke-width="1.2" />
    <line x1="60" y1="103" x2="60" y2="108" stroke="#fef08a" stroke-width="1.2" />
    <line x1="12" y1="60" x2="17" y2="60" stroke="#fef08a" stroke-width="1.2" />
    <line x1="103" y1="60" x2="108" y2="60" stroke="#fef08a" stroke-width="1.2" />

    <line x1="26" y1="26" x2="30" y2="30" stroke="#f59e0b" stroke-width="0.9" />
    <line x1="94" y1="94" x2="90" y2="90" stroke="#f59e0b" stroke-width="0.9" />
    <line x1="26" y1="94" x2="30" y2="90" stroke="#f59e0b" stroke-width="0.9" />
    <line x1="94" y1="26" x2="90" y2="30" stroke="#f59e0b" stroke-width="0.9" />

    <!-- Orbital Planar Beads -->
    <circle cx="60" cy="14" r="1.8" fill="#fffbeb" filter="url(#needleGlow)" />
    <circle cx="106" cy="60" r="1.5" fill="#fef08a" />
    <circle cx="60" cy="106" r="1.5" fill="#fef08a" />
    <circle cx="14" cy="60" r="1.5" fill="#fef08a" />
  </g>

  <!-- Inner Sacred Geometry Astrolabe Reticle -->
  <g class="inner-reticle-ring">
    <circle cx="60" cy="60" r="32" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="6 3" stroke-opacity="0.7" />
    <circle cx="60" cy="60" r="24" stroke="#d4af37" stroke-width="0.6" stroke-opacity="0.5" />
    <!-- Triangular Harmonics -->
    <polygon points="60,28 87.7,76 32.3,76" stroke="#fbbf24" stroke-width="0.6" stroke-opacity="0.4" fill="none" />
    <polygon points="60,92 87.7,44 32.3,44" stroke="#fbbf24" stroke-width="0.6" stroke-opacity="0.4" fill="none" />
  </g>

  <!-- Ambient Twinkles -->
  <g class="star-twinkle-1" transform="translate(94, 22)">
    <path d="M0 -3.5 Q0 0 3.5 0 Q0 0 0 3.5 Q0 0 -3.5 0 Q0 0 0 -3.5 Z" fill="#fef08a" filter="url(#needleGlow)" />
  </g>
  <g class="star-twinkle-2" transform="translate(24, 92)">
    <path d="M0 -3 Q0 0 3 0 Q0 0 0 3 Q0 0 -3 0 Q0 0 0 -3 Z" fill="#fde047" />
  </g>

  <!-- 8-Pointed Master Compass & Star Needle -->
  <g class="compass-star-needle" filter="url(#amberGlow)">
    <!-- Diagonal Subtle Beams -->
    <polygon points="60,38 63,57 82,60 63,63 60,82 57,63 38,60 57,57" fill="url(#needleGold)" opacity="0.6" />

    <!-- Cardinal Major Needle Rays (North - South - East - West) -->
    <!-- North Arrow -->
    <polygon points="60,18 64,56 60,54" fill="#fffbeb" />
    <polygon points="60,18 56,56 60,54" fill="#d97706" />

    <!-- South Arrow -->
    <polygon points="60,102 64,64 60,66" fill="#b45309" />
    <polygon points="60,102 56,64 60,66" fill="#78350f" />

    <!-- East Arrow -->
    <polygon points="102,60 64,56 66,60" fill="#fef08a" />
    <polygon points="102,60 64,64 66,60" fill="#d97706" />

    <!-- West Arrow -->
    <polygon points="18,60 56,56 54,60" fill="#f59e0b" />
    <polygon points="18,60 56,64 54,60" fill="#92400e" />

    <!-- Core Sunburst Astrolabe Hub -->
    <circle cx="60" cy="60" r="7" fill="url(#astrolabeGold)" stroke="#fffbeb" stroke-width="1" />
    <circle cx="60" cy="60" r="3.2" fill="#ffffff" class="core-pulsar" filter="url(#needleGlow)" />
  </g>
</svg>
