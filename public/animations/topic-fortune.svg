<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- 24K Liquid Gold & Solar Gradients -->
    <radialGradient id="fortuneAuraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#ca8a04" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#713f12" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="solidGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="55%" stop-color="#d4af37" />
      <stop offset="85%" stop-color="#996515" />
      <stop offset="100%" stop-color="#54370a" />
    </linearGradient>

    <linearGradient id="innerCoinFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1404" />
      <stop offset="50%" stop-color="#0c0902" />
      <stop offset="100%" stop-color="#1f1605" />
    </linearGradient>

    <linearGradient id="shimmerBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <filter id="goldBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="sparkleBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .aura-pulse {
        animation: pulseAura 4s ease-in-out infinite;
        transform-origin: 60px 60px;
      }
      .coin-levitate {
        animation: levitateCoin 4s ease-in-out infinite;
        transform-origin: 60px 60px;
      }
      .sunburst-spin {
        animation: spinSunburst 28s linear infinite;
        transform-origin: 60px 60px;
      }
      .outer-glyph-spin {
        animation: spinGlyphs 36s linear infinite reverse;
        transform-origin: 60px 60px;
      }
      .shimmer-sweep {
        animation: sweepLight 4s ease-in-out infinite;
      }
      .coin-sparkle-1 {
        animation: twinkleStar 2.4s ease-in-out infinite;
      }
      .coin-sparkle-2 {
        animation: twinkleStar 3s ease-in-out 1.2s infinite;
      }
      .ascending-spark-1 {
        animation: riseSpark1 3.5s ease-in-out infinite;
      }
      .ascending-spark-2 {
        animation: riseSpark2 4.2s ease-in-out 1.5s infinite;
      }

      @keyframes levitateCoin {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-4px) scale(1.03); }
      }
      @keyframes pulseAura {
        0%, 100% { transform: scale(0.92); opacity: 0.7; }
        50% { transform: scale(1.14); opacity: 1; }
      }
      @keyframes spinSunburst {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes spinGlyphs {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes sweepLight {
        0% { transform: translateX(-80px) rotate(25deg); opacity: 0; }
        30% { opacity: 0.8; }
        70% { opacity: 0.8; }
        100% { transform: translateX(80px) rotate(25deg); opacity: 0; }
      }
      @keyframes twinkleStar {
        0%, 100% { opacity: 0.2; transform: scale(0.6); }
        50% { opacity: 1; transform: scale(1.25); filter: drop-shadow(0 0 5px #fde047); }
      }
      @keyframes riseSpark1 {
        0% { transform: translateY(12px) scale(0.6); opacity: 0; }
        35% { opacity: 0.9; }
        80% { opacity: 0.75; }
        100% { transform: translateY(-18px) scale(1.1); opacity: 0; }
      }
      @keyframes riseSpark2 {
        0% { transform: translateY(15px) scale(0.5); opacity: 0; }
        40% { opacity: 0.85; }
        85% { opacity: 0.7; }
        100% { transform: translateY(-22px) scale(0.9); opacity: 0; }
      }
    </style>
  </defs>

  <!-- Ambient Radiant Gold Aura -->
  <circle cx="60" cy="60" r="54" fill="url(#fortuneAuraGlow)" class="aura-pulse" />

  <!-- Outer Orbiting Celestial Degree Ring -->
  <g class="outer-glyph-spin">
    <circle cx="60" cy="60" r="50" stroke="#ca8a04" stroke-opacity="0.25" stroke-width="0.8" />
    <circle cx="60" cy="60" r="46" stroke="url(#solidGoldGrad)" stroke-width="0.9" stroke-dasharray="4 6 1 6" stroke-opacity="0.75" />
    <circle cx="60" cy="14" r="1.8" fill="#fffbeb" filter="url(#sparkleBloom)" />
    <circle cx="106" cy="60" r="1.5" fill="#fde047" />
    <circle cx="60" cy="106" r="1.8" fill="#fffbeb" filter="url(#sparkleBloom)" />
    <circle cx="14" cy="60" r="1.5" fill="#fde047" />
  </g>

  <!-- Floating Ascending Gold Light Sparks -->
  <g class="ascending-spark-1" transform="translate(24, 64)">
    <circle cx="0" cy="0" r="2.5" fill="#fef08a" filter="url(#sparkleBloom)" />
  </g>
  <g class="ascending-spark-2" transform="translate(96, 54)">
    <circle cx="0" cy="0" r="2.2" fill="#fffbeb" filter="url(#sparkleBloom)" />
  </g>

  <!-- Twinkling Starlight -->
  <g class="coin-sparkle-1" transform="translate(26, 26)">
    <path d="M0 -3.5 Q0 0 3.5 0 Q0 0 0 3.5 Q0 0 -3.5 0 Q0 0 0 -3.5 Z" fill="#fffbeb" filter="url(#sparkleBloom)" />
  </g>
  <g class="coin-sparkle-2" transform="translate(94, 26)">
    <path d="M0 -3.5 Q0 0 3.5 0 Q0 0 0 3.5 Q0 0 -3.5 Z" fill="#fde047" filter="url(#sparkleBloom)" />
  </g>

  <!-- Luxury Celestial Coin of Abundance (Main Group) -->
  <g class="coin-levitate" filter="url(#goldBloom)">
    <!-- 24K Gold Minted Rim -->
    <circle cx="60" cy="60" r="32" fill="url(#solidGoldGrad)" stroke="#fef08a" stroke-width="1.2" />
    <circle cx="60" cy="60" r="29" fill="url(#innerCoinFace)" stroke="#d4af37" stroke-width="0.8" />

    <!-- Mask for Clean Internal Coin Reflections -->
    <g clip-path="url(#coinClip)">
      <clipPath id="coinClip">
        <circle cx="60" cy="60" r="28" />
      </clipPath>

      <!-- Shimmer Sweep Reflection -->
      <rect x="20" y="20" width="80" height="80" fill="url(#shimmerBeam)" class="shimmer-sweep" opacity="0.4" pointer-events="none" />
    </g>

    <!-- Rotating Sacred Sunburst Astrolabe on Coin Face -->
    <g class="sunburst-spin">
      <!-- 8-Pointed Geometric Sun Rays -->
      <polygon points="60,36 63,55 78,48 65,58 78,66 63,65 60,84 57,65 42,66 55,58 42,48 57,55"
               fill="url(#solidGoldGrad)"
               opacity="0.85" />

      <!-- Inner Concentric Sacred Rings -->
      <circle cx="60" cy="60" r="16" stroke="#fde047" stroke-width="0.75" stroke-dasharray="2 3" fill="none" opacity="0.8" />
      <circle cx="60" cy="60" r="10" stroke="#fef08a" stroke-width="0.6" fill="none" opacity="0.9" />
    </g>

    <!-- Center Radiant Sol Diamond Jewel -->
    <circle cx="60" cy="60" r="4" fill="url(#solidGoldGrad)" stroke="#ffffff" stroke-width="0.8" />
    <circle cx="60" cy="60" r="1.8" fill="#ffffff" filter="url(#sparkleBloom)" />
  </g>
</svg>
