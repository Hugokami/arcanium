<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Radiant Abundance Gold Gradients -->
    <radialGradient id="fortuneAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#ca8a04" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#713f12" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="coinGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <linearGradient id="lemniscateGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef9c3" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#eab308" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="coinShine" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .bg-aura {
        animation: pulseFortuneAura 4s ease-in-out infinite;
        transform-origin: center;
      }
      .main-pentacle-talisman {
        animation: levitatePentacle 4s ease-in-out infinite;
        transform-origin: 60px 60px;
      }
      .inner-star-rotate {
        animation: slowStarRotate 32s linear infinite;
        transform-origin: 60px 60px;
      }
      .infinity-loop {
        animation: dashInfinity 6s linear infinite;
      }
      .ascending-coin-1 {
        animation: floatUp1 3.5s ease-in-out infinite;
      }
      .ascending-coin-2 {
        animation: floatUp2 4.2s ease-in-out 1.2s infinite;
      }
      .ascending-coin-3 {
        animation: floatUp3 3.8s ease-in-out 2s infinite;
      }
      .sparkle-burst {
        animation: sparkleSpin 3s ease-in-out infinite;
        transform-origin: center;
      }

      @keyframes levitatePentacle {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-5px) scale(1.04); }
      }
      @keyframes slowStarRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseFortuneAura {
        0%, 100% { transform: scale(0.92); opacity: 0.7; }
        50% { transform: scale(1.14); opacity: 1; }
      }
      @keyframes floatUp1 {
        0% { transform: translateY(12px) scale(0.7); opacity: 0; }
        30% { opacity: 0.9; }
        80% { opacity: 0.8; }
        100% { transform: translateY(-18px) scale(1.05); opacity: 0; }
      }
      @keyframes floatUp2 {
        0% { transform: translateY(15px) scale(0.6); opacity: 0; }
        30% { opacity: 0.85; }
        80% { opacity: 0.75; }
        100% { transform: translateY(-22px) scale(0.95); opacity: 0; }
      }
      @keyframes floatUp3 {
        0% { transform: translateY(10px) scale(0.75); opacity: 0; }
        40% { opacity: 1; }
        100% { transform: translateY(-16px) scale(1.1); opacity: 0; }
      }
      @keyframes dashInfinity {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 180; }
      }
      @keyframes sparkleSpin {
        0%, 100% { opacity: 0.2; transform: scale(0.7) rotate(0deg); }
        50% { opacity: 1; transform: scale(1.2) rotate(90deg); filter: drop-shadow(0 0 4px #fef08a); }
      }
    </style>
  </defs>

  <!-- Ambient Yellow-Gold Glow -->
  <circle cx="60" cy="60" r="54" fill="url(#fortuneAura)" class="bg-aura" />

  <!-- Infinity Lemniscate Flowing Ring (Sacred Abundance) -->
  <path d="M60 60 C42 42, 22 42, 22 60 C22 78, 42 78, 60 60 C78 42, 98 42, 98 60 C98 78, 78 78, 60 60 Z"
        stroke="url(#lemniscateGrad)"
        stroke-width="1.2"
        fill="none"
        stroke-dasharray="8 4 2 4"
        class="infinity-loop" />

  <!-- Outer Rays & Golden Ring -->
  <circle cx="60" cy="60" r="50" stroke="#ca8a04" stroke-opacity="0.25" stroke-width="0.75" />
  <circle cx="60" cy="60" r="45" stroke="url(#coinGold)" stroke-width="1" stroke-opacity="0.8" stroke-dasharray="3 3" />

  <!-- Ascending Floating Gold Coins / Light Orbs -->
  <g class="ascending-coin-1" transform="translate(24, 60)">
    <circle cx="0" cy="0" r="4" fill="url(#coinGold)" stroke="#fef08a" stroke-width="0.75" filter="url(#coinShine)" />
    <path d="M-1.5 0 L1.5 0 M0 -1.5 L0 1.5" stroke="#713f12" stroke-width="0.6" />
  </g>
  <g class="ascending-coin-2" transform="translate(96, 56)">
    <circle cx="0" cy="0" r="3.5" fill="url(#coinGold)" stroke="#fef08a" stroke-width="0.6" filter="url(#coinShine)" />
    <circle cx="0" cy="0" r="1.2" fill="#fffbeb" />
  </g>
  <g class="ascending-coin-3" transform="translate(60, 20)">
    <circle cx="0" cy="0" r="3" fill="#fef08a" filter="url(#coinShine)" />
  </g>

  <!-- Sparkle Starbursts -->
  <g class="sparkle-burst" transform="translate(94, 26)">
    <path d="M0 -4 Q0 0 4 0 Q0 0 0 4 Q0 0 -4 0 Q0 0 0 -4 Z" fill="#fef08a" filter="url(#coinShine)" />
  </g>
  <g class="sparkle-burst" transform="translate(26, 92)" style="animation-delay: 1.5s;">
    <path d="M0 -3.5 Q0 0 3.5 0 Q0 0 0 3.5 Q0 0 -3.5 0 Q0 0 0 -3.5 Z" fill="#fef08a" filter="url(#coinShine)" />
  </g>

  <!-- Central Floating Pentacle of Abundance -->
  <g class="main-pentacle-talisman" filter="url(#goldGlow)">
    <!-- Pentacle Rim -->
    <circle cx="60" cy="60" r="28" fill="#150f04" stroke="url(#coinGold)" stroke-width="2.5" />
    <circle cx="60" cy="60" r="24.5" stroke="#fef08a" stroke-width="0.8" fill="none" opacity="0.9" />
    
    <!-- Rotating Sacred Pentagram -->
    <g class="inner-star-rotate">
      <!-- 5-Pointed Interlocking Star -->
      <polygon points="60,37.5 66.5,57.5 49.5,45.2 70.5,45.2 53.5,57.5"
               stroke="url(#coinGold)"
               stroke-width="1.6"
               stroke-linejoin="round"
               fill="rgba(234, 179, 8, 0.12)" />
      
      <!-- Inner Node Jewels -->
      <circle cx="60" cy="37.5" r="1.5" fill="#ffffff" filter="url(#coinShine)" />
      <circle cx="70.5" cy="45.2" r="1.5" fill="#fef08a" />
      <circle cx="66.5" cy="57.5" r="1.5" fill="#fef08a" />
      <circle cx="53.5" cy="57.5" r="1.5" fill="#fef08a" />
      <circle cx="49.5" cy="45.2" r="1.5" fill="#fef08a" />
    </g>

    <!-- Center Radiant Diamond Core -->
    <circle cx="60" cy="60" r="3" fill="#ffffff" filter="url(#coinShine)" />
  </g>
</svg>
