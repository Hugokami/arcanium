<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Sacred Emerald & Mint Jade Gradients -->
    <radialGradient id="growthAuraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="sproutGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="35%" stop-color="#10b981" />
      <stop offset="70%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <linearGradient id="moonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <filter id="emeraldBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="sporeBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .aura-breath {
        animation: breathGrowthAura 4s ease-in-out infinite;
        transform-origin: 60px 60px;
      }
      .seed-bloom-group {
        animation: levitateSprout 4.5s ease-in-out infinite;
        transform-origin: 60px 60px;
      }
      .sacred-rings-spin {
        animation: spinSacredRings 36s linear infinite;
        transform-origin: 60px 60px;
      }
      .crystal-pulse {
        animation: pulseCrystal 2.8s ease-in-out infinite;
        transform-origin: 60px 32px;
      }
      .spore-1 {
        animation: floatSpore1 3.2s ease-in-out infinite;
      }
      .spore-2 {
        animation: floatSpore2 4s ease-in-out 1.2s infinite;
      }
      .spore-3 {
        animation: floatSpore3 3.6s ease-in-out 2s infinite;
      }
      .twinkle-star {
        animation: starTwinkle 2.5s ease-in-out infinite;
      }

      @keyframes levitateSprout {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-4px) scale(1.03); }
      }
      @keyframes breathGrowthAura {
        0%, 100% { transform: scale(0.92); opacity: 0.65; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      @keyframes spinSacredRings {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseCrystal {
        0%, 100% { transform: scale(0.85); opacity: 0.8; }
        50% { transform: scale(1.25); opacity: 1; filter: drop-shadow(0 0 6px #a7f3d0); }
      }
      @keyframes floatSpore1 {
        0% { transform: translateY(14px) scale(0.6); opacity: 0; }
        35% { opacity: 0.9; }
        80% { opacity: 0.8; }
        100% { transform: translateY(-22px) scale(1.1); opacity: 0; }
      }
      @keyframes floatSpore2 {
        0% { transform: translateY(18px) scale(0.5); opacity: 0; }
        40% { opacity: 0.85; }
        85% { opacity: 0.7; }
        100% { transform: translateY(-24px) scale(0.9); opacity: 0; }
      }
      @keyframes floatSpore3 {
        0% { transform: translateY(12px) scale(0.7); opacity: 0; }
        30% { opacity: 0.95; }
        100% { transform: translateY(-20px) scale(1.2); opacity: 0; }
      }
      @keyframes starTwinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.6); }
        50% { opacity: 1; transform: scale(1.2); }
      }
    </style>
  </defs>

  <!-- Ambient Radiant Emerald Aura -->
  <circle cx="60" cy="60" r="54" fill="url(#growthAuraGlow)" class="aura-breath" />

  <!-- Sacred Geometry Matrix Ring (Flower of Life Halo) -->
  <g class="sacred-rings-spin">
    <circle cx="60" cy="60" r="50" stroke="#10b981" stroke-opacity="0.2" stroke-width="0.75" />
    <circle cx="60" cy="60" r="44" stroke="url(#moonGold)" stroke-width="0.9" stroke-dasharray="3 6" stroke-opacity="0.65" />
    <circle cx="60" cy="16" r="1.8" fill="#a7f3d0" filter="url(#sporeBloom)" />
    <circle cx="98" cy="38" r="1.5" fill="#34d399" />
    <circle cx="98" cy="82" r="1.5" fill="#34d399" />
    <circle cx="60" cy="104" r="1.8" fill="#a7f3d0" />
    <circle cx="22" cy="82" r="1.5" fill="#34d399" />
    <circle cx="22" cy="38" r="1.5" fill="#34d399" />
  </g>

  <!-- Ascending Bio-Luminescent Light Spores -->
  <g class="spore-1" transform="translate(34, 56)">
    <circle cx="0" cy="0" r="2.4" fill="#a7f3d0" filter="url(#sporeBloom)" />
  </g>
  <g class="spore-2" transform="translate(86, 52)">
    <circle cx="0" cy="0" r="2" fill="#6ee7b7" filter="url(#sporeBloom)" />
  </g>
  <g class="spore-3" transform="translate(60, 24)">
    <circle cx="0" cy="0" r="2.8" fill="#ffffff" filter="url(#sporeBloom)" />
  </g>

  <!-- Twinkles -->
  <g class="twinkle-star" transform="translate(26, 26)">
    <path d="M0 -3.5 Q0 0 3.5 0 Q0 0 0 3.5 Q0 0 -3.5 0 Q0 0 0 -3.5 Z" fill="#a7f3d0" filter="url(#sporeBloom)" />
  </g>
  <g class="twinkle-star" transform="translate(94, 26)" style="animation-delay: 1.2s;">
    <path d="M0 -3.5 Q0 0 3.5 0 Q0 0 0 3.5 Q0 0 -3.5 0 Q0 0 0 -3.5 Z" fill="#fef08a" filter="url(#sporeBloom)" />
  </g>

  <!-- Sprouting Sacred Moon & Celestial Petals (Main Group) -->
  <g class="seed-bloom-group" filter="url(#emeraldBloom)">
    <!-- Radiant Golden Crescent Moon Cradle -->
    <path d="M42 40 C38 52, 42 68, 54 78 C66 88, 82 86, 88 80 C74 84, 58 78, 50 68 C42 58, 42 46, 42 40 Z"
          fill="url(#moonGold)"
          stroke="#a7f3d0"
          stroke-width="0.8" />

    <!-- Left Sprouting Crystal Leaf -->
    <path d="M58 74 C44 64, 38 50, 44 42 C54 44, 56 60, 58 74 Z"
          fill="url(#sproutGrad)"
          stroke="#a7f3d0"
          stroke-width="0.8"
          opacity="0.85" />

    <!-- Right Sprouting Crystal Leaf -->
    <path d="M62 74 C76 64, 82 50, 76 42 C66 44, 64 60, 62 74 Z"
          fill="url(#sproutGrad)"
          stroke="#a7f3d0"
          stroke-width="0.8"
          opacity="0.85" />

    <!-- Central Awakening Seed / Rising Lotus Spire -->
    <path d="M60 76 C54 60, 54 44, 60 32 C66 44, 66 60, 60 76 Z"
          fill="url(#sproutGrad)"
          stroke="#ffffff"
          stroke-width="1" />

    <!-- Center Fibonacci Spiral Tendril Highlight -->
    <path d="M60 72 Q60 56 60 38" stroke="#ffffff" stroke-width="0.75" stroke-linecap="round" opacity="0.8" />

    <!-- Apex Illuminating Crown Crystal -->
    <g class="crystal-pulse">
      <polygon points="60,24 63,30 60,35 57,30" fill="#ffffff" filter="url(#sporeBloom)" />
      <circle cx="60" cy="30" r="1.5" fill="#fef08a" />
    </g>
  </g>
</svg>
