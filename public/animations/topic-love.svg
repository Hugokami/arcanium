<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Rose & Magenta Celestial Gradients -->
    <radialGradient id="loveAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#be185d" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#881337" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="40%" stop-color="#f43f5e" />
      <stop offset="85%" stop-color="#9f1239" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>

    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe4e6" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#f43f5e" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="goldFiligree" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <filter id="roseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .bg-aura {
        animation: pulseAura 4s ease-in-out infinite;
        transform-origin: center;
      }
      .sacred-heart {
        animation: heartBeat 3s ease-in-out infinite;
        transform-origin: 60px 62px;
      }
      .orbital-ring-1 {
        animation: spinRing1 12s linear infinite;
        transform-origin: 60px 60px;
      }
      .orbital-ring-2 {
        animation: spinRing2 9s linear infinite reverse;
        transform-origin: 60px 60px;
      }
      .flame-crown {
        animation: flameWave 2.5s ease-in-out infinite alternate;
        transform-origin: 60px 42px;
      }
      .satellite-1 {
        animation: satPulse 3s ease-in-out infinite;
      }
      .star-sparkle-1 {
        animation: twinkle 2.2s ease-in-out infinite;
      }
      .star-sparkle-2 {
        animation: twinkle 2.8s ease-in-out 1.1s infinite;
      }
      .star-sparkle-3 {
        animation: twinkle 2s ease-in-out 0.6s infinite;
      }

      @keyframes heartBeat {
        0%, 100% { transform: scale(1); }
        15% { transform: scale(1.08); }
        30% { transform: scale(0.98); }
        45% { transform: scale(1.05); }
        60% { transform: scale(1); }
      }
      @keyframes pulseAura {
        0%, 100% { transform: scale(0.92); opacity: 0.7; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      @keyframes spinRing1 {
        0% { transform: rotate(0deg) scaleY(0.42) rotate(25deg); }
        100% { transform: rotate(360deg) scaleY(0.42) rotate(25deg); }
      }
      @keyframes spinRing2 {
        0% { transform: rotate(0deg) scaleY(0.38) rotate(-40deg); }
        100% { transform: rotate(360deg) scaleY(0.38) rotate(-40deg); }
      }
      @keyframes flameWave {
        0% { transform: scale(0.95) translateY(0px); opacity: 0.85; }
        100% { transform: scale(1.08) translateY(-2px); opacity: 1; filter: drop-shadow(0 0 5px #f43f5e); }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.7); }
        50% { opacity: 1; transform: scale(1.25); }
      }
      @keyframes satPulse {
        0%, 100% { r: 2.2; }
        50% { r: 3.2; filter: drop-shadow(0 0 4px #fda4af); }
      }
    </style>
  </defs>

  <!-- Ambient Pulsing Aura -->
  <circle cx="60" cy="60" r="54" fill="url(#loveAura)" class="bg-aura" />

  <!-- Outer Sacred Geometry Ring -->
  <circle cx="60" cy="60" r="48" stroke="#f43f5e" stroke-opacity="0.25" stroke-width="0.8" stroke-dasharray="2 3" />
  <circle cx="60" cy="60" r="52" stroke="#fda4af" stroke-opacity="0.15" stroke-width="0.5" />

  <!-- Primary Elliptical Orbital Ring 1 -->
  <g class="orbital-ring-1">
    <ellipse cx="60" cy="60" rx="42" ry="42" stroke="url(#ringGrad1)" stroke-width="1.2" fill="none" stroke-dasharray="12 4 2 4" />
    <circle cx="102" cy="60" r="2.5" fill="#ffe4e6" class="satellite-1" filter="url(#softGlow)" />
    <circle cx="18" cy="60" r="1.8" fill="#fda4af" opacity="0.8" />
  </g>

  <!-- Secondary Elliptical Orbital Ring 2 -->
  <g class="orbital-ring-2">
    <ellipse cx="60" cy="60" rx="36" ry="36" stroke="#fb7185" stroke-opacity="0.45" stroke-width="1" fill="none" stroke-dasharray="8 6" />
    <circle cx="60" cy="24" r="2.2" fill="#ffe4e6" filter="url(#softGlow)" />
  </g>

  <!-- Twinkling Stardust Sparkles -->
  <g class="star-sparkle-1" transform="translate(26, 26)">
    <path d="M0 -4 Q0 0 4 0 Q0 0 0 4 Q0 0 -4 0 Q0 0 0 -4 Z" fill="#ffe4e6" filter="url(#softGlow)" />
  </g>
  <g class="star-sparkle-2" transform="translate(92, 34)">
    <path d="M0 -3.5 Q0 0 3.5 0 Q0 0 0 3.5 Q0 0 -3.5 0 Q0 0 0 -3.5 Z" fill="#fbcfe8" filter="url(#softGlow)" />
  </g>
  <g class="star-sparkle-3" transform="translate(30, 88)">
    <path d="M0 -3 Q0 0 3 0 Q0 0 0 3 Q0 0 -3 0 Q0 0 0 -3 Z" fill="#fda4af" />
  </g>

  <!-- Sacred Heart Group -->
  <g class="sacred-heart" filter="url(#roseGlow)">
    <!-- Mystical Flame / Halo Crown above Heart -->
    <g class="flame-crown">
      <path d="M60 32 C62 36, 67 39, 65 44 C63 48, 59 47, 60 51 C57 47, 54 48, 55 43 C56 38, 60 35, 60 32 Z" fill="url(#goldFiligree)" />
      <!-- Golden Cross Radiance -->
      <line x1="60" y1="28" x2="60" y2="35" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round" />
      <line x1="56.5" y1="31" x2="63.5" y2="31" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round" />
    </g>

    <!-- Main Sacred Heart Body -->
    <path d="M60 82 C44 70, 34 59, 34 49 C34 41, 40 36, 47 36 C52 36, 57 39, 60 43 C63 39, 68 36, 73 36 C80 36, 86 41, 86 49 C86 59, 76 70, 60 82 Z"
          fill="url(#heartGrad)"
          stroke="#ffe4e6"
          stroke-width="1"
          stroke-opacity="0.8" />

    <!-- Inner Heart Luminous Facet -->
    <path d="M60 75 C48 65, 40 56, 40 48 C40 43, 44 40, 48 40 C53 40, 57 43, 60 46 C63 43, 67 40, 72 40 C76 40, 80 43, 80 48 C80 56, 72 65, 60 75 Z"
          fill="none"
          stroke="#fda4af"
          stroke-width="0.75"
          stroke-opacity="0.5" />

    <!-- Golden Crown Filigree & Ribbon around Heart -->
    <path d="M37 54 Q60 62 83 54" stroke="url(#goldFiligree)" stroke-width="1.4" stroke-linecap="round" fill="none" />
    <path d="M38 52 Q60 60 82 52" stroke="#fef08a" stroke-width="0.6" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- Center Radiant Diamond Core -->
    <circle cx="60" cy="54" r="2.5" fill="#ffffff" filter="url(#softGlow)" />
  </g>
</svg>
