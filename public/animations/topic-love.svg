<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Romantic Rose & Cosmic Gold Gradients -->
    <radialGradient id="loveGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#fb7185" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#881337" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="twinFlameLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe4e6" />
      <stop offset="40%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <linearGradient id="twinFlameRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>

    <linearGradient id="orbitalRoseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#fb7185" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#fda4af" stop-opacity="0.9" />
    </linearGradient>

    <filter id="roseBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="starBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .aura-breath {
        animation: breathAura 4s ease-in-out infinite;
        transform-origin: 60px 60px;
      }
      .heart-levitate {
        animation: levitateHeart 3.5s ease-in-out infinite;
        transform-origin: 60px 58px;
      }
      .orbit-1 {
        animation: spinOrbit1 14s linear infinite;
        transform-origin: 60px 58px;
      }
      .orbit-2 {
        animation: spinOrbit2 10s linear infinite reverse;
        transform-origin: 60px 58px;
      }
      .core-gem {
        animation: gemPulse 2.5s ease-in-out infinite;
        transform-origin: 60px 56px;
      }
      .sparkle-1 {
        animation: twinkleStar 2.2s ease-in-out infinite;
      }
      .sparkle-2 {
        animation: twinkleStar 2.8s ease-in-out 1.2s infinite;
      }

      @keyframes levitateHeart {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-4px) scale(1.03); }
      }
      @keyframes breathAura {
        0%, 100% { transform: scale(0.92); opacity: 0.7; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      @keyframes spinOrbit1 {
        0% { transform: rotate(0deg) scaleY(0.4) rotate(25deg); }
        100% { transform: rotate(360deg) scaleY(0.4) rotate(25deg); }
      }
      @keyframes spinOrbit2 {
        0% { transform: rotate(0deg) scaleY(0.36) rotate(-40deg); }
        100% { transform: rotate(360deg) scaleY(0.36) rotate(-40deg); }
      }
      @keyframes gemPulse {
        0%, 100% { transform: scale(0.85); opacity: 0.8; }
        50% { transform: scale(1.25); opacity: 1; filter: drop-shadow(0 0 6px #ffe4e6); }
      }
      @keyframes twinkleStar {
        0%, 100% { opacity: 0.2; transform: scale(0.6); }
        50% { opacity: 1; transform: scale(1.2); }
      }
    </style>
  </defs>

  <!-- Ambient Radiant Rose Aura -->
  <circle cx="60" cy="60" r="54" fill="url(#loveGlow)" class="aura-breath" />

  <!-- Outer Sacred Geometry Astrolabe Ring -->
  <circle cx="60" cy="58" r="48" stroke="#fb7185" stroke-opacity="0.2" stroke-width="0.75" />
  <circle cx="60" cy="58" r="44" stroke="#f43f5e" stroke-opacity="0.3" stroke-width="0.5" stroke-dasharray="3 5" />

  <!-- Orbiting Celestial Ring 1 with Pearl -->
  <g class="orbit-1">
    <ellipse cx="60" cy="58" rx="42" ry="42" stroke="url(#orbitalRoseGold)" stroke-width="1.2" fill="none" stroke-dasharray="14 6 3 6" />
    <circle cx="102" cy="58" r="2.5" fill="#ffe4e6" filter="url(#starBloom)" />
    <circle cx="18" cy="58" r="1.6" fill="#fef08a" opacity="0.85" />
  </g>

  <!-- Orbiting Celestial Ring 2 with Starlight -->
  <g class="orbit-2">
    <ellipse cx="60" cy="58" rx="36" ry="36" stroke="#fda4af" stroke-opacity="0.45" stroke-width="0.9" fill="none" stroke-dasharray="8 6" />
    <circle cx="60" cy="22" r="2.2" fill="#fff1f2" filter="url(#starBloom)" />
  </g>

  <!-- Twinkling Stardust -->
  <g class="sparkle-1" transform="translate(26, 26)">
    <path d="M0 -3.5 Q0 0 3.5 0 Q0 0 0 3.5 Q0 0 -3.5 0 Q0 0 0 -3.5 Z" fill="#ffe4e6" filter="url(#starBloom)" />
  </g>
  <g class="sparkle-2" transform="translate(94, 30)">
    <path d="M0 -3.5 Q0 0 3.5 0 Q0 0 0 3.5 Q0 0 -3.5 0 Q0 0 0 -3.5 Z" fill="#fef08a" filter="url(#starBloom)" />
  </g>

  <!-- Sleek Modern Twin-Flame Celestial Heart -->
  <g class="heart-levitate" filter="url(#roseBloom)">
    <!-- Back Ethereal Glow Shadow -->
    <path d="M60 78 C42 66, 32 54, 32 44 C32 35, 39 30, 47 30 C53 30, 57 34, 60 38 C63 34, 67 30, 73 30 C81 30, 88 35, 88 44 C88 54, 78 66, 60 78 Z"
          fill="rgba(159, 18, 57, 0.4)"
          stroke="#f43f5e"
          stroke-width="0.5" />

    <!-- Left Interlocking Flame Arc -->
    <path d="M60 78 C44 67, 34 56, 34 45 C34 36, 41 31, 48 31 C54 31, 58 35, 60 39 C58 50, 48 58, 60 78 Z"
          fill="url(#twinFlameLeft)"
          stroke="#ffe4e6"
          stroke-width="1" />

    <!-- Right Interlocking Flame Arc -->
    <path d="M60 78 C76 67, 86 56, 86 45 C86 36, 79 31, 72 31 C66 31, 62 35, 60 39 C62 50, 72 58, 60 78 Z"
          fill="url(#twinFlameRight)"
          stroke="#fef08a"
          stroke-width="1" />

    <!-- Sleek Facet Highlight Lines -->
    <path d="M48 35 C43 35, 38 39, 38 45 C38 53, 46 62, 57 72" stroke="#ffffff" stroke-width="0.75" stroke-linecap="round" fill="none" opacity="0.75" />
    <path d="M72 35 C77 35, 82 39, 82 45 C82 53, 74 62, 63 72" stroke="#fef08a" stroke-width="0.75" stroke-linecap="round" fill="none" opacity="0.75" />

    <!-- Floating Celestial Diamond Core -->
    <g class="core-gem">
      <!-- 8-Pointed Star Diamond -->
      <polygon points="60,48 62.5,53.5 68,56 62.5,58.5 60,64 57.5,58.5 52,56 57.5,53.5" fill="#ffffff" filter="url(#starBloom)" />
      <circle cx="60" cy="56" r="1.8" fill="#ffe4e6" />
    </g>
  </g>
</svg>
