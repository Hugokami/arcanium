<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="60%" stop-color="#0c0a09"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="75%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="300" height="500" rx="16" fill="url(#bgGlow)"/>

  <!-- Outer Double Bezel -->
  <rect x="8" y="8" width="284" height="484" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>
  <rect x="14" y="14" width="272" height="472" rx="9" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" opacity="0.4" stroke-dasharray="4 2"/>

  <!-- Corner Flourishes -->
  <g stroke="url(#goldGrad)" stroke-width="1" fill="none" opacity="0.7">
    <path d="M 22 40 L 40 22 M 22 22 L 34 22 L 22 34 Z"/>
    <path d="M 278 40 L 260 22 M 278 22 L 266 22 L 278 34 Z"/>
    <path d="M 22 460 L 40 478 M 22 478 L 34 478 L 22 466 Z"/>
    <path d="M 278 460 L 260 478 M 278 478 L 266 478 L 278 466 Z"/>
  </g>

  <!-- Central Celestial Astrolabe Dial -->
  <g transform="translate(150, 250)" filter="url(#goldGlow)">
    <!-- Outer Astrolabe Ring -->
    <circle r="95" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.8"/>
    <circle r="90" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" opacity="0.5" stroke-dasharray="2 3"/>
    <circle r="75" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6"/>
    <circle r="55" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" opacity="0.4"/>
    <circle r="35" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.7"/>

    <!-- Concentric Star Polygons (Octagram & Hexagram) -->
    <!-- 8-pointed star -->
    <path d="M 0 -75 L 22 -22 L 75 0 L 22 22 L 0 75 L -22 22 L -75 0 L -22 -22 Z" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.75"/>
    <path d="M 0 -75 L 22 -22 L 75 0 L 22 22 L 0 75 L -22 22 L -75 0 L -22 -22 Z" transform="rotate(45)" fill="none" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.4"/>

    <!-- Sacred Center Oculus -->
    <circle r="16" fill="#141210" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <circle r="6" fill="url(#goldGrad)"/>
    <circle r="2" fill="#ffffff"/>

    <!-- Planetary Rays / Hour Indicators (12 Rays for 12 Zodiac Houses) -->
    <g stroke="url(#goldGrad)" stroke-width="0.75" opacity="0.6">
      <line x1="0" y1="-95" x2="0" y2="-75"/>
      <line x1="0" y1="95" x2="0" y2="75"/>
      <line x1="-95" y1="0" x2="-75" y2="0"/>
      <line x1="95" y1="0" x2="75" y2="0"/>

      <line x1="-67" y1="-67" x2="-53" y2="-53"/>
      <line x1="67" y1="-67" x2="53" y2="-53"/>
      <line x1="-67" y1="67" x2="-53" y2="53"/>
      <line x1="67" y1="67" x2="53" y2="53"/>

      <line x1="-82" y1="-47" x2="-65" y2="-37"/>
      <line x1="82" y1="-47" x2="65" y2="-37"/>
      <line x1="-82" y1="47" x2="-65" y2="37"/>
      <line x1="82" y1="47" x2="65" y2="37"/>
    </g>

    <!-- Top and Bottom Mini Astrolabes for Symmetry -->
    <g transform="translate(0, -145)">
      <circle r="24" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.6"/>
      <circle r="12" fill="none" stroke="url(#goldGrad)" stroke-width="0.6" opacity="0.4"/>
      <circle r="3" fill="url(#goldGrad)" opacity="0.8"/>
      <!-- Cross -->
      <line x1="0" y1="-24" x2="0" y2="24" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.4"/>
      <line x1="-24" y1="0" x2="24" y2="0" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.4"/>
    </g>

    <g transform="translate(0, 145)">
      <circle r="24" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.6"/>
      <circle r="12" fill="none" stroke="url(#goldGrad)" stroke-width="0.6" opacity="0.4"/>
      <circle r="3" fill="url(#goldGrad)" opacity="0.8"/>
      <!-- Cross -->
      <line x1="0" y1="-24" x2="0" y2="24" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.4"/>
      <line x1="-24" y1="0" x2="24" y2="0" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.4"/>
    </g>
  </g>

  <!-- Fine Micro-Dots Filigree -->
  <g fill="url(#goldGrad)" opacity="0.5">
    <circle cx="150" cy="45" r="2"/>
    <circle cx="150" cy="455" r="2"/>
    <circle cx="45" cy="250" r="1.5"/>
    <circle cx="255" cy="250" r="1.5"/>
  </g>
</svg>
