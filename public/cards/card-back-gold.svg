<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="60%" stop-color="#0c0a09"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="75%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <radialGradient id="oculusAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes rotateCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes rotateCCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes pulseAura {
        0%, 100% { transform: scale(0.92); opacity: 0.4; }
        50% { transform: scale(1.1); opacity: 0.85; }
      }
      @keyframes shimmerRays {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 0.85; }
      }
      .anim-cw-slow {
        animation: rotateCW 48s linear infinite;
        transform-origin: 150px 250px;
      }
      .anim-ccw-slow {
        animation: rotateCCW 32s linear infinite;
        transform-origin: 150px 250px;
      }
      .anim-cw-fast {
        animation: rotateCW 24s linear infinite;
        transform-origin: 150px 250px;
      }
      .anim-pulse {
        animation: pulseAura 4s ease-in-out infinite;
        transform-origin: 150px 250px;
      }
      .anim-rays {
        animation: shimmerRays 3.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="300" height="500" rx="16" fill="url(#bgGlow)"/>

  <!-- Outer Double Bezel -->
  <rect x="8" y="8" width="284" height="484" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>
  <rect x="14" y="14" width="272" height="472" rx="9" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" opacity="0.4" stroke-dasharray="4 2"/>

  <!-- Corner Flourishes -->
  <g stroke="url(#goldGrad)" stroke-width="1" fill="none" opacity="0.7">
    <path d="M 22 40 L 40 22 M 22 22 L 34 22 L 22 34 Z"/>
    <path d="M 278 40 L 260 22 M 278 22 L 266 22 L 278 34 Z"/>
    <path d="M 22 460 L 40 478 M 22 478 L 34 478 L 22 466 Z"/>
    <path d="M 278 460 L 260 478 M 278 478 L 266 478 L 278 466 Z"/>
  </g>

  <!-- Breathing Center Aura -->
  <circle cx="150" cy="250" r="85" fill="url(#oculusAura)" class="anim-pulse"/>

  <!-- Outer Astrolabe Fixed Ring & Ticks -->
  <g transform="translate(150, 250)">
    <circle r="95" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.8"/>
    <circle r="90" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" opacity="0.5" stroke-dasharray="2 3"/>
  </g>

  <!-- Rotating Ring 1 (Clockwise) -->
  <g class="anim-cw-slow" filter="url(#goldGlow)">
    <g transform="translate(150, 250)">
      <circle r="80" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.65"/>
      <!-- 12 Astrolabe Degree Nodes -->
      <g fill="url(#goldGrad)" opacity="0.8">
        <circle cx="0" cy="-80" r="2.5"/>
        <circle cx="40" cy="-69.28" r="2"/>
        <circle cx="69.28" cy="-40" r="2"/>
        <circle cx="80" cy="0" r="2.5"/>
        <circle cx="69.28" cy="40" r="2"/>
        <circle cx="40" cy="69.28" r="2"/>
        <circle cx="0" cy="80" r="2.5"/>
        <circle cx="-40" cy="69.28" r="2"/>
        <circle cx="-69.28" cy="40" r="2"/>
        <circle cx="-80" cy="0" r="2.5"/>
        <circle cx="-69.28" cy="-40" r="2"/>
        <circle cx="-40" cy="-69.28" r="2"/>
      </g>
      <!-- Octagram Outer -->
      <path d="M 0 -75 L 22 -22 L 75 0 L 22 22 L 0 75 L -22 22 L -75 0 L -22 -22 Z" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.75"/>
    </g>
  </g>

  <!-- Rotating Ring 2 (Counter-Clockwise) -->
  <g class="anim-ccw-slow">
    <g transform="translate(150, 250)">
      <circle r="55" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" opacity="0.5"/>
      <path d="M 0 -55 L 16 -16 L 55 0 L 16 16 L 0 55 L -16 16 L -55 0 L -16 -16 Z" transform="rotate(45)" fill="none" stroke="url(#goldGrad)" stroke-width="0.6" opacity="0.5"/>
      <!-- Inner Star Nodes -->
      <circle cx="0" cy="-55" r="1.8" fill="url(#goldGrad)"/>
      <circle cx="55" cy="0" r="1.8" fill="url(#goldGrad)"/>
      <circle cx="0" cy="55" r="1.8" fill="url(#goldGrad)"/>
      <circle cx="-55" cy="0" r="1.8" fill="url(#goldGrad)"/>
    </g>
  </g>

  <!-- Central Star Core (Clockwise) -->
  <g class="anim-cw-fast">
    <g transform="translate(150, 250)">
      <circle r="35" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.7"/>
      <!-- 6-point hexagram -->
      <polygon points="0,-32 27.7,16 -27.7,16" fill="none" stroke="url(#goldGrad)" stroke-width="0.7" opacity="0.6"/>
      <polygon points="0,32 27.7,-16 -27.7,-16" fill="none" stroke="url(#goldGrad)" stroke-width="0.7" opacity="0.6"/>
    </g>
  </g>

  <!-- Central Oculus Core -->
  <g transform="translate(150, 250)">
    <circle r="16" fill="#141210" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <circle r="6" fill="url(#goldGrad)" class="anim-pulse"/>
    <circle r="2.2" fill="#ffffff"/>
  </g>

  <!-- Shimmering Radiating Rays -->
  <g transform="translate(150, 250)" stroke="url(#goldGrad)" stroke-width="0.75" class="anim-rays">
    <line x1="0" y1="-95" x2="0" y2="-82"/>
    <line x1="0" y1="95" x2="0" y2="82"/>
    <line x1="-95" y1="0" x2="-82" y2="0"/>
    <line x1="95" y1="0" x2="82" y2="0"/>

    <line x1="-67" y1="-67" x2="-58" y2="-58"/>
    <line x1="67" y1="-67" x2="58" y2="-58"/>
    <line x1="-67" y1="67" x2="-58" y2="58"/>
    <line x1="67" y1="67" x2="58" y2="58"/>
  </g>

  <!-- Top and Bottom Symmetrical Mini Astrolabes -->
  <g transform="translate(150, 105)">
    <circle r="24" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.6"/>
    <circle r="12" fill="none" stroke="url(#goldGrad)" stroke-width="0.6" opacity="0.4"/>
    <circle r="3" fill="url(#goldGrad)" opacity="0.8"/>
    <line x1="0" y1="-24" x2="0" y2="24" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.4"/>
    <line x1="-24" y1="0" x2="24" y2="0" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.4"/>
  </g>

  <g transform="translate(150, 395)">
    <circle r="24" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.6"/>
    <circle r="12" fill="none" stroke="url(#goldGrad)" stroke-width="0.6" opacity="0.4"/>
    <circle r="3" fill="url(#goldGrad)" opacity="0.8"/>
    <line x1="0" y1="-24" x2="0" y2="24" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.4"/>
    <line x1="-24" y1="0" x2="24" y2="0" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.4"/>
  </g>
</svg>
