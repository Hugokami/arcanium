<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500" width="100%" height="100%">
  <defs>
    <radialGradient id="metaBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="50%" stop-color="#0f051d"/>
      <stop offset="100%" stop-color="#05010a"/>
    </radialGradient>
    <linearGradient id="metaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe"/>
      <stop offset="35%" stop-color="#c084fc"/>
      <stop offset="70%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="300" height="500" rx="16" fill="url(#metaBg)"/>

  <!-- Concentric Border Frame -->
  <rect x="8" y="8" width="284" height="484" rx="12" fill="none" stroke="url(#metaGrad)" stroke-width="1.2" opacity="0.6"/>
  <rect x="14" y="14" width="272" height="472" rx="9" fill="none" stroke="url(#metaGrad)" stroke-width="0.75" opacity="0.3" stroke-dasharray="3 3"/>

  <!-- Metatron's Cube Geometry (13 Spheres + Intersecting Platonic Lines) -->
  <g transform="translate(150, 250)">
    <!-- 13 Nodes of Fruit of Life: R=52 (Outer 6), R=104 (Outer 6), Center (1) -->
    <!-- Outer Connecting Lines -->
    <g stroke="url(#metaGrad)" stroke-width="0.8" fill="none" opacity="0.5">
      <!-- Outer Hexagon -->
      <polygon points="0,-104 90,-52 90,52 0,104 -90,52 -90,-52"/>
      <!-- Inner Hexagon -->
      <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26"/>
      <!-- Hexagram 1 -->
      <polygon points="0,-104 90,52 -90,52"/>
      <!-- Hexagram 2 -->
      <polygon points="0,104 90,-52 -90,-52"/>
      
      <!-- Interconnecting Nodes / Star Matrix -->
      <line x1="0" y1="-104" x2="0" y2="104"/>
      <line x1="-90" y1="-52" x2="90" y2="52"/>
      <line x1="-90" y1="52" x2="90" y2="-52"/>

      <line x1="0" y1="-104" x2="90" y2="52"/>
      <line x1="0" y1="-104" x2="-90" y2="52"/>
      <line x1="0" y1="104" x2="90" y2="-52"/>
      <line x1="0" y1="104" x2="-90" y2="-52"/>

      <line x1="-90" y1="-52" x2="0" y2="104"/>
      <line x1="90" y1="-52" x2="0" y2="104"/>
      <line x1="-90" y1="52" x2="0" y2="-104"/>
      <line x1="90" y1="52" x2="0" y2="-104"/>
    </g>

    <!-- 13 Sacred Spheres / Nodes -->
    <g fill="#0f051d" stroke="url(#metaGrad)" stroke-width="1.2">
      <!-- Center Sphere -->
      <circle cx="0" cy="0" r="16"/>
      <!-- Inner Ring of 6 -->
      <circle cx="0" cy="-52" r="13"/>
      <circle cx="45" cy="-26" r="13"/>
      <circle cx="45" cy="26" r="13"/>
      <circle cx="0" cy="52" r="13"/>
      <circle cx="-45" cy="26" r="13"/>
      <circle cx="-45" cy="-26" r="13"/>
      <!-- Outer Ring of 6 -->
      <circle cx="0" cy="-104" r="14"/>
      <circle cx="90" cy="-52" r="14"/>
      <circle cx="90" cy="52" r="14"/>
      <circle cx="0" cy="104" r="14"/>
      <circle cx="-90" cy="52" r="14"/>
      <circle cx="-90" cy="-52" r="14"/>
    </g>

    <!-- Inner Node Glyphs / Crystals -->
    <g fill="url(#metaGrad)">
      <circle cx="0" cy="0" r="6"/>
      <circle cx="0" cy="-52" r="4"/>
      <circle cx="45" cy="-26" r="4"/>
      <circle cx="45" cy="26" r="4"/>
      <circle cx="0" cy="52" r="4"/>
      <circle cx="-45" cy="26" r="4"/>
      <circle cx="-45" cy="-26" r="4"/>
      <circle cx="0" cy="-104" r="4.5"/>
      <circle cx="90" cy="-52" r="4.5"/>
      <circle cx="90" cy="52" r="4.5"/>
      <circle cx="0" cy="104" r="4.5"/>
      <circle cx="-90" cy="52" r="4.5"/>
      <circle cx="-90" cy="-52" r="4.5"/>
    </g>

    <!-- Top & Bottom Harmonic Echoes -->
    <g transform="translate(0, -155)" stroke="url(#metaGrad)" stroke-width="0.8" fill="none" opacity="0.5">
      <polygon points="0,-24 20,12 -20,12"/>
      <polygon points="0,24 20,-12 -20,-12"/>
      <circle cx="0" cy="0" r="8" fill="#0f051d"/>
      <circle cx="0" cy="0" r="3" fill="url(#metaGrad)"/>
    </g>

    <g transform="translate(0, 155)" stroke="url(#metaGrad)" stroke-width="0.8" fill="none" opacity="0.5">
      <polygon points="0,-24 20,12 -20,12"/>
      <polygon points="0,24 20,-12 -20,-12"/>
      <circle cx="0" cy="0" r="8" fill="#0f051d"/>
      <circle cx="0" cy="0" r="3" fill="url(#metaGrad)"/>
    </g>
  </g>
</svg>
