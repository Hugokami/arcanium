<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="85%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="silverGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="cyanStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="cosmicPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <style>
      @keyframes orbitRotate1 {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes orbitRotate2 {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes starBlink {
        0%, 100% { opacity: 0.3; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      @keyframes coreGlow {
        0%, 100% { transform: scale(0.95); opacity: 0.5; }
        50% { transform: scale(1.15); opacity: 0.9; }
      }
      .anim-orbit-1 {
        animation: orbitRotate1 36s linear infinite;
        transform-origin: 150px 250px;
      }
      .anim-orbit-2 {
        animation: orbitRotate2 28s linear infinite;
        transform-origin: 150px 250px;
      }
      .anim-star-1 {
        animation: starBlink 3s ease-in-out infinite;
        transform-origin: 150px 250px;
      }
      .anim-star-2 {
        animation: starBlink 4.5s ease-in-out infinite 1.5s;
        transform-origin: 150px 250px;
      }
      .anim-core {
        animation: coreGlow 4s ease-in-out infinite;
        transform-origin: 150px 250px;
      }
    </style>
  </defs>

  <!-- Deep Cosmos Background -->
  <rect width="300" height="500" rx="16" fill="url(#spaceGlow)"/>

  <!-- Border Shell -->
  <rect x="8" y="8" width="284" height="484" rx="12" fill="none" stroke="url(#silverGlow)" stroke-width="1.2" opacity="0.5"/>
  <rect x="14" y="14" width="272" height="472" rx="9" fill="none" stroke="#334155" stroke-width="0.75" opacity="0.6"/>

  <!-- Background Pulsing Nebula -->
  <circle cx="150" cy="250" r="90" fill="url(#cosmicPulse)" class="anim-core"/>

  <!-- Scattered Starlight Constellation Dots -->
  <g fill="#ffffff" class="anim-star-1">
    <circle cx="50" cy="80" r="1.5"/>
    <circle cx="240" cy="90" r="1.8"/>
    <circle cx="230" cy="280" r="1.4"/>
    <circle cx="60" cy="420" r="1.6"/>
    <circle cx="150" cy="40" r="1.8"/>
  </g>
  <g fill="#67e8f9" class="anim-star-2">
    <circle cx="70" cy="220" r="1.2"/>
    <circle cx="250" cy="410" r="1.4"/>
    <circle cx="150" cy="460" r="1.8"/>
    <circle cx="100" cy="140" r="1.1"/>
    <circle cx="200" cy="360" r="1.1"/>
  </g>

  <!-- Constellation Geometric Lines -->
  <g stroke="url(#silverGlow)" stroke-width="0.6" fill="none" opacity="0.35">
    <path d="M 50 80 L 150 40 L 240 90 L 230 280 L 250 410 L 150 460 L 60 420 L 70 220 Z"/>
    <path d="M 50 80 L 150 250 L 240 90"/>
    <path d="M 60 420 L 150 250 L 250 410"/>
  </g>

  <!-- Rotating Planetary Orbit Ellipses 1 -->
  <g class="anim-orbit-1">
    <g transform="translate(150, 250)">
      <ellipse rx="100" ry="42" fill="none" stroke="url(#silverGlow)" stroke-width="1" opacity="0.65"/>
      <!-- Satellite orbiter on ring -->
      <circle cx="100" cy="0" r="3.5" fill="#f8fafc" stroke="#818cf8" stroke-width="1"/>
      <circle cx="-100" cy="0" r="2.5" fill="#67e8f9"/>
    </g>
  </g>

  <!-- Rotating Planetary Orbit Ellipses 2 -->
  <g class="anim-orbit-2">
    <g transform="translate(150, 250)">
      <ellipse rx="95" ry="40" fill="none" stroke="url(#cyanStar)" stroke-width="0.85" transform="rotate(60)" opacity="0.6"/>
      <!-- Satellite orbiter -->
      <circle cx="0" cy="40" r="3" fill="#818cf8"/>
      <circle cx="0" cy="-40" r="2" fill="#c7d2fe"/>
    </g>
  </g>

  <!-- Concentric Moon Phase Sphere -->
  <g transform="translate(150, 250)">
    <circle r="65" fill="none" stroke="url(#silverGlow)" stroke-width="1.2" opacity="0.75"/>
    <circle r="45" fill="none" stroke="url(#cyanStar)" stroke-width="0.75" opacity="0.5" stroke-dasharray="3 3"/>
    
    <!-- Sacred Moon Phase Quartet -->
    <!-- Top (Full Moon) -->
    <circle cx="0" cy="-65" r="7" fill="#f8fafc" stroke="#818cf8" stroke-width="1"/>
    <!-- Bottom (New Moon) -->
    <circle cx="0" cy="65" r="7" fill="#0f172a" stroke="#818cf8" stroke-width="1"/>
    <!-- Left (First Quarter) -->
    <circle cx="-65" cy="0" r="7" fill="#0f172a" stroke="#818cf8" stroke-width="1"/>
    <path d="M -65 -7 A 7 7 0 0 1 -65 7 Z" fill="#f8fafc"/>
    <!-- Right (Last Quarter) -->
    <circle cx="65" cy="0" r="7" fill="#0f172a" stroke="#818cf8" stroke-width="1"/>
    <path d="M 65 -7 A 7 7 0 0 0 65 7 Z" fill="#f8fafc"/>

    <!-- Center Mystic Eye / Core Star -->
    <circle r="18" fill="#090d16" stroke="url(#silverGlow)" stroke-width="1.5"/>
    <!-- 8-Point Star Core -->
    <path d="M 0 -14 L 4 -4 L 14 0 L 4 4 L 0 14 L -4 4 L -14 0 L -4 -4 Z" fill="url(#silverGlow)" class="anim-core"/>
    <circle r="3" fill="#ffffff"/>
  </g>
</svg>
